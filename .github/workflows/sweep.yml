# Vertiefung: Liquiditaets-Sweep im Aufwaertstrend (Tageskerzen)
name: Sweep-Pruefung
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/sweep.yml', 'dienst/backtest19b.mjs']
permissions:
  contents: write
concurrency: sweep
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: /tmp/duka
          key: duka-v1-${{ github.run_id }}
          restore-keys: duka-v1-
      - name: Datenwerkzeug
        run: npm i --no-save --no-package-lock dukascopy-node@1 >/dev/null 2>&1
      - name: Rechnen
        run: node dienst/backtest19b.mjs
      - name: Speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dienst/backtest-sweep.json
          git diff --cached --quiet || (git commit -m "Sweep-Pruefung aktualisiert [skip ci]" && git pull --rebase -X theirs -q && git push)
