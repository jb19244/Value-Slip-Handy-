# Legt taeglich den Kopf der Signal-Hash-Kette oeffentlich ab (dienst/beweis.json). Wer spaeter das Protokoll prueft,
# sieht so, dass keine Meldung nachtraeglich geaendert oder geloescht wurde. Enthaelt keine Inhalte, nur Fingerabdruecke.
name: Beweis
on:
  workflow_dispatch:
  schedule:
    - cron: '47 22 * * *'
permissions:
  contents: write
concurrency: beweis
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Kettenkopf holen und ablegen
        run: |
          URL=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('dienst/status.json','utf8')).url||'')}catch(e){console.log('')}")
          [ -n "$URL" ] || exit 0
          R=$(curl -s -m 20 -H "Origin: https://jb19244.github.io" "$URL/trade/proof" || true)
          echo "$R"
          node -e "const fs=require('fs');let j;try{j=JSON.parse(process.argv[1])}catch(e){process.exit(0)}if(!j.head)process.exit(0);const f='dienst/beweis.json';let L=[];try{L=JSON.parse(fs.readFileSync(f,'utf8'))}catch(e){}if(L.length&&L[L.length-1].head===j.head)process.exit(0);L.push({date:new Date().toISOString().slice(0,10),n:j.n,head:j.head});fs.writeFileSync(f,JSON.stringify(L,null,1))" "$R"
      - name: Speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dienst/beweis.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Beweis: Kettenkopf $(date -u +%F) [skip ci]" && git pull --rebase -q && git push)
