name: Probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['dienst/probe.mjs']
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node dienst/probe.mjs
