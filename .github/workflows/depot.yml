# Depot-Strategien und Tages-Studien werktags frueh neu rechnen (Monatswechsel, IBS-Freigabe)
name: Depot-Signale
on:
  workflow_dispatch:
  schedule:
    - cron: '41 6 * * 1-5'
permissions:
  contents: write
concurrency: backtest
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rechnen
        run: node dienst/backtest4.mjs
      - name: Speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dienst/backtest-more.json
          git diff --cached --quiet || (git commit -m "Depot-Signale aktualisiert [skip ci]" && git pull --rebase -X theirs -q && git push)
