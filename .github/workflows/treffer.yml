# Trefferquote der Kauf-Strategien: Filter mit Lern- und Pruefzeit
name: Trefferquote-Filter
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/treffer.yml', 'dienst/backtest24.mjs']
permissions:
  contents: write
concurrency: treffer
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rechnen
        run: node dienst/backtest24.mjs
      - name: Speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dienst/backtest-trefferquote.json
          git diff --cached --quiet || (git commit -m "Trefferquote-Filter geprueft [skip ci]" && git pull --rebase -X theirs -q && git push)
