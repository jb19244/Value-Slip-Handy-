# Einzelaktien: Mitglieder von S&P 100 und DAX 30 aus dem Jahr 2010, getestet ab 2010
name: Aktien-Rueckrechnung
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['dienst/backtest10.mjs', '.github/workflows/aktien.yml']
permissions:
  contents: write
concurrency: aktien
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rechnen
        run: node dienst/backtest10.mjs
      - name: Speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dienst/backtest-stocks.json
          git diff --cached --quiet || (git commit -m "Aktien-Rueckrechnung aktualisiert [skip ci]" && git pull --rebase -X theirs -q && git push)
