# Woechentliche Strategiesuche: neue Regel-Kandidaten, streng geprueft (Sonntag frueh)
name: Strategiesuche
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 0'
  push:
    branches: [main]
    paths: ['dienst/backtest11.mjs', '.github/workflows/suche.yml']
permissions:
  contents: write
concurrency: suche
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rechnen
        run: node dienst/backtest11.mjs
      - name: Speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dienst/backtest-suche.json dienst/suche-registry.json
          git diff --cached --quiet || (git commit -m "Strategiesuche aktualisiert [skip ci]" && git pull --rebase -X theirs -q && git push)
