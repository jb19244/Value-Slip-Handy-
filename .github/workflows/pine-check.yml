# Prueft die TradingView-Skripte mit dem Pine-Compiler von TradingView (Syntax und Typen)
name: Pine-Pruefung
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['trade/tradingview-*.txt', '.github/workflows/pine-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Kompilieren
        run: |
          fail=0
          for f in trade/tradingview-*.txt; do
            R=$(curl -s -m 60 -F "source=<$f" "https://pine-facade.tradingview.com/pine-facade/translate_light?user_name=Guest&v=3")
            node -e "const j = JSON.parse(process.argv[1]); const e = (j.result && (j.result.errors2 || j.result.errors)) || []; const w = (j.result && (j.result.warnings2 || j.result.warnings)) || [];
              console.log(process.argv[2] + ': ' + (j.success ? 'ok' : 'FEHLER') + ', ' + e.length + ' Fehler, ' + w.length + ' Warnungen');
              e.concat(w).slice(0, 40).forEach((x) => console.log('  Zeile ' + x.start.line + ':' + x.start.column + ' ' + x.message + ' ' + JSON.stringify(x.ctx || {})));
              process.exit(j.success && !e.length ? 0 : 1);" "$R" "$f" || fail=1
          done
          exit $fail
