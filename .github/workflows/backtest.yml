# Rueckrechnung fuer Trade Check mit echten Kursen der letzten 60 Tage (jeden Sonntag, sonst von Hand)
name: Rueckrechnung
on:
  workflow_dispatch:
  schedule:
    - cron: '23 18 * * 0'
permissions:
  contents: write
concurrency: backtest
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rechnen
        run: node dienst/backtest.mjs
      - name: Grosse Rueckrechnung (2 Jahre, 1 Std)
        run: node dienst/backtest2.mjs
      - name: Strategien aus der Forschung
        continue-on-error: true
        run: node dienst/backtest3.mjs
      - name: Weitere Strategien aus Studien (Tag, Stunde, Depot)
        continue-on-error: true
        run: node dienst/backtest4.mjs
      - name: Speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dienst/backtest.json dienst/backtest-1h.json && ([ -f dienst/backtest-extra.json ] && git add dienst/backtest-extra.json || true) && ([ -f dienst/backtest-more.json ] && git add dienst/backtest-more.json || true)
          git diff --cached --quiet || (git commit -m "Rueckrechnung aktualisiert [skip ci]" && git pull --rebase -X theirs -q && git push)
