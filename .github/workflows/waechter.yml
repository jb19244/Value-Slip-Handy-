# Waechter von aussen: prueft alle 2 Stunden, ob der Push-Dienst bei Cloudflare lebt und Kurse bekommt.
# Schlaegt der Lauf fehl, schickt GitHub eine E-Mail. Der Dienst selbst meldet umgekehrt per Push, wenn GitHub haengt.
name: Waechter
on:
  schedule:
    - cron: '41 */2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Push-Dienst pruefen
        run: |
          URL=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('dienst/status.json','utf8')).url||'')}catch(e){console.log('')}")
          if [ -z "$URL" ]; then echo "Keine Dienst-Adresse hinterlegt"; exit 0; fi
          R=""
          for i in 1 2 3; do R=$(curl -s -m 20 -H "Origin: https://jb19244.github.io" "$URL/trade/health" || true); [ -n "$R" ] && break; sleep 20; done
          echo "Antwort: $R"
          node -e "let j; try { j = JSON.parse(process.argv[1]); } catch (e) { console.error('::error::Push-Dienst nicht erreichbar'); process.exit(1); }
            if (!j.push) { console.log('Push in der App nicht eingeschaltet, nichts zu pruefen'); process.exit(0); }
            if (!j.ok) { console.error('::error::Push-Dienst meldet ein Problem: letzter Lauf vor ' + j.age + ' Min, Kursdaten ' + (j.data ? 'ok' : 'fehlen')); process.exit(1); }
            console.log('Alles ok: letzter Lauf vor ' + j.age + ' Min' + (j.gh && j.gh.length ? ', GitHub: ' + j.gh.join('; ') : ''));" "$R"
