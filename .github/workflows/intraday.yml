# Daytrading-Rueckrechnung auf 5- und 15-Min-Kerzen (Alpaca). Schluessel kommen nur aus den Repository-Secrets.
name: Daytrading-Rueckrechnung
on:
  workflow_dispatch:
  schedule:
    - cron: '7 19 * * 0'
  push:
    branches: [main]
    paths: ['dienst/backtest5.mjs', '.github/workflows/intraday.yml']
permissions:
  contents: write
concurrency: intraday
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rechnen
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: node dienst/backtest5.mjs
      - name: Speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dienst/backtest-intra.json
          git diff --cached --quiet || (git commit -m "Daytrading-Rueckrechnung aktualisiert [skip ci]" && git pull --rebase -X theirs -q && git push)
