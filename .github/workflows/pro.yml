# Profi-Strategien fuer Privatanleger: Pairs Trading (Yahoo) und Small-Cap-Momentum (Alpaca, Schluessel nur aus Secrets)
name: Profi-Strategien-Rueckrechnung
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['dienst/backtest8.mjs', '.github/workflows/pro.yml']
permissions:
  contents: write
concurrency: pro
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rechnen
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: node dienst/backtest8.mjs
      - name: Speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dienst/backtest-pro.json
          git diff --cached --quiet || (git commit -m "Profi-Strategien-Rueckrechnung aktualisiert [skip ci]" && git pull --rebase -X theirs -q && git push)
