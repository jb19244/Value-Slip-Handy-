name: Probe2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['dienst/probe2.mjs']
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: mkdir -p /tmp/p && cd /tmp/p && npm init -y >/dev/null && npm i dukascopy-node@1 >/dev/null 2>&1 && cp $GITHUB_WORKSPACE/dienst/probe2.mjs . && node probe2.mjs
