# Kurzfrist-/Scalping-Rueckrechnung auf 5-Min-Kerzen (Alpaca), breites Universum. Schluessel nur aus den Repository-Secrets.
name: Scalping-Rueckrechnung
on:
  workflow_dispatch:
  schedule:
    - cron: '37 20 * * 0'
  push:
    branches: [main]
    paths: ['dienst/backtest6.mjs', '.github/workflows/scalp.yml']
permissions:
  contents: write
concurrency: scalp
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rechnen
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: node dienst/backtest6.mjs
      - name: Speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dienst/backtest-scalp.json
          git diff --cached --quiet || (git commit -m "Scalping-Rueckrechnung aktualisiert [skip ci]" && git pull --rebase -X theirs -q && git push)
