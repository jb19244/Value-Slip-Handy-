# Pruefung der Positionsgroesse nach Marktlage (startet bei Aenderung oder von Hand)
name: Positionsgroesse-Pruefung
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['dienst/backtest14.mjs', '.github/workflows/size.yml']
permissions:
  contents: write
concurrency: size
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rechnen
        run: node dienst/backtest14.mjs
      - name: Speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dienst/backtest-size.json
          git diff --cached --quiet || (git commit -m "Positionsgroesse-Pruefung aktualisiert [skip ci]" && git pull --rebase -X theirs -q && git push)
