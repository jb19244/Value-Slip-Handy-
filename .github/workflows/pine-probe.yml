name: Pine-Probe
on:
  push:
    branches: [main]
    paths: ['.github/probe/**', '.github/workflows/pine-probe.yml']
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          UA="Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Safari/605.1.15"
          for u in "translate_light?user_name=Guest&pine_id=00000000-0000-0000-0000-000000000000" "translate_light?user_name=Guest&pine_id=00000000-0000-0000-0000-000000000000&v=3" "translate?user_name=Guest&pine_id=00000000-0000-0000-0000-000000000000" "translate/00000000-0000-0000-0000-000000000000/1?user_name=Guest" "parse?user_name=Guest" "translate_light?user_name=Guest&v=3&full=true"; do
            echo "== $u"; curl -s -m 60 -A "$UA" -H "Origin: https://www.tradingview.com" -H "Referer: https://www.tradingview.com/" -F "source=<.github/probe/overload.pine" "https://pine-facade.tradingview.com/pine-facade/$u" | head -c 900; echo
          done
