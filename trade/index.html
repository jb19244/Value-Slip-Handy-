<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trade Check</title>
<meta name="description" content="Bestätigung für Daytrading-Setups: Struktur, Liquidität, News, Handelszeit, COT und Positionsgröße mit Live-Daten.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --bg:#000000; --surface:#111214; --surface2:#1D1E22; --fg:#F5F5F7; --muted:#8E8E93; --line:#26272B;
  --accent:#F5F5F7; --accent-fg:#000000; --link:#7FB2FF;
  --good:#2FD07A; --good-bg:rgba(47,208,122,.14); --bad:#FF5A5F; --bad-bg:rgba(255,90,95,.14); --warn:#FFB340; --warn-bg:rgba(255,179,64,.14);
  --overlay:rgba(0,0,0,.7);
  --font-d:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',system-ui,sans-serif;
  --font-b:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
html{height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 var(--font-b);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--fg)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{height:100%;display:flex;flex-direction:column;min-height:0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:10px;border-bottom:1px solid var(--line);background:var(--bg)}
.brand{display:flex;align-items:center;gap:7px;font-family:var(--font-d);font-weight:700;font-size:19px;letter-spacing:-.01em;white-space:nowrap}
.brand svg{width:20px;height:20px;color:var(--good)}
.chip{display:flex;align-items:center;gap:7px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13px;color:var(--muted);min-width:0}
.chip b{font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.good{background:var(--good)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.page{display:flex;flex-direction:column;gap:14px;padding-block:16px 28px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:rgba(10,10,12,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);padding-top:6px;padding-bottom:max(6px,env(safe-area-inset-bottom,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;font-size:12px;font-weight:500;color:var(--muted)}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--fg)}
.tab[aria-selected="true"] svg{stroke-width:2.2}
.card{background:var(--surface);border:0;border-radius:18px;padding:16px;min-width:0}
h2{margin:0;font-family:var(--font-d);font-weight:700;font-size:20px;letter-spacing:-.01em}
h3{margin:0;font-size:15px;font-weight:600}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.label{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--muted)}
.hint{margin:8px 0 0;font-size:13px;color:var(--muted)}
.err{margin:8px 0 0;font-size:13px;color:var(--bad);font-weight:500}
.num{font-family:var(--font-d);font-variant-numeric:tabular-nums;font-weight:600}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.seg{display:flex;gap:2px;padding:3px;background:var(--surface2);border-radius:11px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(12,26,38,.18)}
.seg.dir button[data-dir="1"][aria-pressed="true"]{background:var(--good);color:var(--bg)}
.seg.dir button[data-dir="-1"][aria-pressed="true"]{background:var(--bad);color:var(--bg)}
.field input::placeholder{color:var(--muted);opacity:.45}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;font-weight:600;font-size:15px;background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.good-bg{background:var(--good-bg);color:var(--good)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.block{flex:1}
.btn[disabled]{opacity:.5}
.btns{display:flex;gap:10px;margin-top:14px}
.link{color:var(--link);font-weight:600}
.scroller{display:flex;gap:8px;overflow-x:auto;margin:0 -14px;padding:2px 14px 4px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.ichip{flex:none;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:14px;white-space:nowrap}
.ichip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:12px}
.price b{font-family:var(--font-d);font-size:40px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field span{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select{width:100%;min-width:0;height:46px;border:1px solid var(--line);border-radius:11px;background:var(--bg);padding:0 10px;font-family:var(--font-d);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.field select{font-family:var(--font-b);font-size:15px}
.field.txt input{font-family:var(--font-b);font-size:15px;font-weight:500}
.f2{grid-template-columns:repeat(2,minmax(0,1fr))}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{padding:6px 10px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--muted);background:var(--bg)}
.tag[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
details.more{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
details.more summary{list-style:none;cursor:pointer;font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+";font-size:20px;color:var(--muted)}
details.more[open] summary::after{content:"−"}
.verdict{display:flex;align-items:center;gap:14px;padding:16px;border-radius:14px}
.verdict.gruen{background:var(--good-bg);color:var(--good)} .verdict.gelb{background:var(--warn-bg);color:var(--warn)} .verdict.rot{background:var(--bad-bg);color:var(--bad)}
.lamp{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;background:currentColor}
.lamp svg{width:30px;height:30px;stroke:var(--surface);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.verdict .big{font-family:var(--font-d);font-size:30px;font-weight:700;line-height:1;letter-spacing:.03em;text-transform:uppercase}
.verdict p{margin:4px 0 0;font-size:14px;color:var(--fg)}
.items{list-style:none;margin:12px 0 0;padding:0}
.item{display:grid;grid-template-columns:24px minmax(0,1fr);gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item i{grid-row:1 / span 2;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:700;margin-top:1px}
.item i.pro{background:var(--good-bg);color:var(--good)} .item i.contra{background:var(--bad-bg);color:var(--bad)} .item i.warn{background:var(--warn-bg);color:var(--warn)} .item i.neutral{background:var(--surface2);color:var(--muted)}
.item b{font-size:14px} .item span{font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin:12px 0 0}
.kv dt{font-size:12px;color:var(--muted)} .kv dd{margin:0;font-family:var(--font-d);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ladder{list-style:none;margin:10px 0 0;padding:0}
.lv{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.lv:last-child{border-bottom:0}
.lv .n{font-size:13px;overflow-wrap:anywhere} .lv .p{font-family:var(--font-d);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.hero{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.hero div{background:var(--bg);border-radius:12px;padding:10px;min-width:0}
.hero dt{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.hero dd{margin:2px 0 0;font-family:var(--font-d);font-size:20px;white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.guard{margin-top:10px;padding:10px 12px;border-radius:12px;font-size:14px;font-weight:600}
.guard.ok{background:var(--good-bg);color:var(--good)} .guard.stop{background:var(--bad-bg);color:var(--bad)}
.ihead{padding:4px 0 2px}
.ihead .nm{font-size:15px;font-weight:600;color:var(--muted)}
.bigpx{font-family:var(--font-d);font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.chg{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.buysell{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.buysell button{min-height:54px;border-radius:14px;font-size:17px;font-weight:700;background:var(--surface2);color:var(--muted)}
.buysell button[data-dir="1"][aria-pressed="true"]{background:var(--good);color:#00140A}
.buysell button[data-dir="-1"][aria-pressed="true"]{background:var(--bad);color:#1A0003}
.bias.wl{display:grid;grid-template-columns:38px minmax(0,1fr) 64px auto;grid-template-rows:auto;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.bias.wl:last-child{border-bottom:0}
.bias.wl .px{text-align:right;font-size:16px}
.logo{width:38px;height:38px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--fg)}
.wl .nm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl .rt{text-align:right}
.wl .px{font-family:var(--font-d);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.cpill{display:inline-block;margin-top:3px;padding:2px 7px;border-radius:7px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.cpill.good{background:var(--good-bg);color:var(--good)} .cpill.bad{background:var(--bad-bg);color:var(--bad)}
.mini{width:64px;height:28px;display:block}
.depot{padding:6px 0 4px}
.depot .bigpx{font-size:40px}
.lv .acts{display:flex;gap:4px}
.lv .acts button{width:30px;height:30px;border-radius:8px;background:var(--surface2);font-size:12px;font-weight:700;color:var(--muted)}
.lv.now{background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:8px;padding-inline:8px;margin-inline:-8px}
.lv.now .n{color:var(--accent);font-weight:600}
.bias{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.bias:last-child{border-bottom:0}
.bias .nm{font-weight:600} .bias .px{text-align:right;font-family:var(--font-d);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.bias .sub{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.bias .ch{text-align:right;font-size:13px;font-weight:600}
.daybar{position:relative;height:30px;border-radius:8px;background:var(--surface2);margin-top:12px;overflow:hidden}
.daybar span{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden}
.daybar .asia{background:color-mix(in srgb,var(--muted) 22%,transparent)}
.daybar .kz{background:color-mix(in srgb,var(--accent) 35%,transparent)}
.daybar .now{width:2px;background:var(--bad);z-index:2}
.dayaxis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.ev{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:start}
.ev:last-child{border-bottom:0}
.ev .t{font-family:var(--font-d);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.ev.past{opacity:.55}
.ev .ti{font-size:14px;font-weight:500;overflow-wrap:anywhere} .ev .fc{font-size:12px;color:var(--muted)}
.trade{padding:12px 0;border-bottom:1px solid var(--line)}
.trade:last-child{border-bottom:0}
.spark{width:100%;height:80px;margin-top:10px}
table.st{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
table.st th{font-weight:600;color:var(--muted);text-align:right;padding:4px 0 6px;font-size:12px}
table.st th:first-child,table.st td:first-child{text-align:left}
table.st th+th{padding-left:8px}
table.st td{padding:6px 0;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
table.st td:first-child{overflow-wrap:anywhere;padding-right:8px}
.sheet-bg{position:fixed;inset:0;background:var(--overlay);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:16px 16px max(18px,env(safe-area-inset-bottom,0px))}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:30;max-width:calc(100% - 32px)}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;padding:6px 0}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.switch input{width:46px;height:28px;appearance:none;-webkit-appearance:none;border-radius:999px;background:var(--surface2);position:relative;flex:none;border:1px solid var(--line)}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.switch input:checked{background:var(--accent);border-color:var(--accent)}
.switch input:checked::after{left:20px}
.list-plain{list-style:none;margin:8px 0 0;padding:0}
.list-plain li{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.list-plain li:last-child{border-bottom:0}
.chart{width:100%;height:240px;display:block;margin-top:10px;touch-action:manipulation;border-radius:10px;background:var(--bg)}

<script>
// BEGIN LOGIC

var INSTRUMENTS = [

  { k: 'USDCHF', name: 'USD/CHF', y: 'CHF=X', type: 'fx', ccy: ['USD', 'CHF'], quote: 'CHF', cot: '092741', cotSign: -1, dec: 5, zone: 'eu' },
  { k: 'NZDUSD', name: 'NZD/USD', y: 'NZDUSD=X', type: 'fx', ccy: ['NZD', 'USD'], quote: 'USD', cot: '112741', cotSign: 1, dec: 5, zone: 'eu' },
  { k: 'EURJPY', name: 'EUR/JPY', y: 'EURJPY=X', type: 'fx', ccy: ['EUR', 'JPY'], quote: 'JPY', cot: null, dec: 3, zone: 'eu' },
  { k: 'GBPJPY', name: 'GBP/JPY', y: 'GBPJPY=X', type: 'fx', ccy: ['GBP', 'JPY'], quote: 'JPY', cot: null, dec: 3, zone: 'eu' },

  { k: 'BRENT', name: 'Öl (Brent)', y: 'BZ=F', type: 'cmd', ccy: ['USD'], quote: 'USD', cot: null, dec: 2, zone: 'us', basis: true, kw: /crude|oil|opec/i },

];
// Liquide Aktien, die der Scanner zusaetzlich durchsucht (alle bei Trade Republic mit Knock-outs handelbar)
var SCAN_STOCKS = ['NVDA', 'TSLA', 'AAPL', 'MSFT', 'AMZN', 'META', 'GOOGL', 'AMD', 'SAP.DE', 'RHM.DE', 'SIE.DE', 'ALV.DE'];
// Liquide US-Aktien fuer den ORB "Stocks in Play" (Auswahl nach relativem Volumen am Morgen)
var PLAY_STOCKS = ['AAPL', 'MSFT', 'NVDA', 'AMZN', 'META', 'GOOGL', 'TSLA', 'AMD', 'NFLX', 'AVGO', 'JPM', 'BAC', 'XOM', 'CVX', 'WMT', 'COST', 'LLY', 'UNH', 'V', 'MA', 'INTC', 'MU', 'SMCI', 'PLTR', 'COIN', 'MSTR', 'UBER', 'SHOP', 'BA', 'DIS', 'NKE', 'PYPL', 'CRM', 'ORCL', 'ADBE', 'QCOM', 'SNOW', 'ABNB', 'RIVN', 'SOFI', 'HOOD', 'ARM', 'CRWD', 'PANW', 'MRVL'];
function scanUniverse(){ return INSTRUMENTS.concat(SCAN_STOCKS.map(stockInstrument)); }
// Eigene Aktie: Symbol wie bei Yahoo (AAPL, NVDA, SAP.DE, RHM.DE)
function stockInstrument(sym){
  var s = String(sym || '').trim().toUpperCase();
  if (!/^[A-Z0-9^.\-=]{1,15}$/.test(s)) return null;
  var de = /\.(DE|F)$/.test(s);
  return { k: 'S:' + s, name: s, y: s, type: 'stock', ccy: [de ? 'EUR' : 'USD'], quote: de ? 'EUR' : 'USD', cot: null, dec: 2, zone: de ? 'eu' : 'usstock', bench: de ? '^GDAXI' : '^GSPC' };
}
function instrumentByKey(k){
  for (var i = 0; i < INSTRUMENTS.length; i++) if (INSTRUMENTS[i].k === k) return INSTRUMENTS[i];
  return String(k || '').indexOf('S:') === 0 ? stockInstrument(k.slice(2)) : null;
}

// ---- Kursdaten
function parseYahoo(j){
  var r = j && j.chart && j.chart.result && j.chart.result[0];
  if (!r || !Array.isArray(r.timestamp)) return [];
  var q = (r.indicators && r.indicators.quote && r.indicators.quote[0]) || {}, out = [];
  for (var i = 0; i < r.timestamp.length; i++){
    var o = q.open && q.open[i], h = q.high && q.high[i], l = q.low && q.low[i], c = q.close && q.close[i];
    if ([o, h, l, c].every(function(x){ return typeof x === 'number' && isFinite(x); })) out.push({ t: r.timestamp[i] * 1000, o: o, h: Math.max(h, o, c), l: Math.min(l, o, c), c: c, v: (q.volume && q.volume[i]) || 0 });
  }
  return out;
}
function ema(vals, n){
  var k = 2 / (n + 1), out = [], e = null;
  for (var i = 0; i < vals.length; i++){
    if (e == null){ if (i === n - 1){ var s = 0; for (var j = 0; j < n; j++) s += vals[j]; e = s / n; out.push(e); } else out.push(null); }
    else { e = vals[i] * k + e * (1 - k); out.push(e); }
  }
  return out;
}
// ATR nach Wilder
function atr(c, n){
  n = n || 14;
  if (c.length < n + 1) return null;
  var tr = [];
  for (var i = 1; i < c.length; i++) tr.push(Math.max(c[i].h - c[i].l, Math.abs(c[i].h - c[i - 1].c), Math.abs(c[i].l - c[i - 1].c)));
  var a = 0; for (var j = 0; j < n; j++) a += tr[j]; a /= n;
  for (var k = n; k < tr.length; k++) a = (a * (n - 1) + tr[k]) / n;
  return a;
}
// Swing-Hochs/-Tiefs (Fraktal: hoeher/tiefer als k Kerzen links und rechts)
function swings(c, k){
  k = k || 2;
  var hi = [], lo = [];
  for (var i = k; i < c.length - k; i++){
    var isH = true, isL = true;
    for (var j = 1; j <= k; j++){
      if (!(c[i].h > c[i - j].h && c[i].h >= c[i + j].h)) isH = false;
      if (!(c[i].l < c[i - j].l && c[i].l <= c[i + j].l)) isL = false;
    }
    if (isH) hi.push({ i: i, p: c[i].h, t: c[i].t });
    if (isL) lo.push({ i: i, p: c[i].l, t: c[i].t });
  }
  return { hi: hi, lo: lo };
}
// Marktstruktur: Schlusskurs ueber dem letzten Swing-Hoch = Bruch nach oben (BOS in Trendrichtung, sonst CHoCH)
function structure(c, k){
  k = k || 2;
  var sw = swings(c, k), trend = null, last = null, events = [];
  var hiIdx = 0, loIdx = 0, refH = null, refL = null;
  for (var j = 0; j < c.length; j++){
    while (hiIdx < sw.hi.length && sw.hi[hiIdx].i + k <= j){ refH = sw.hi[hiIdx]; hiIdx++; }
    while (loIdx < sw.lo.length && sw.lo[loIdx].i + k <= j){ refL = sw.lo[loIdx]; loIdx++; }
    if (refH && c[j].c > refH.p){
      var ev = { dir: 1, kind: trend === 1 ? 'BOS' : 'CHoCH', level: refH.p, t: c[j].t, i: j };
      events.push(ev); last = ev; trend = 1; refH = null;
    } else if (refL && c[j].c < refL.p){
      var ev2 = { dir: -1, kind: trend === -1 ? 'BOS' : 'CHoCH', level: refL.p, t: c[j].t, i: j };
      events.push(ev2); last = ev2; trend = -1; refL = null;
    }
  }
  return { trend: trend, last: last, events: events, swings: sw };
}
// Fair Value Gaps (3-Kerzen-Luecke), nur noch offene
function fvgs(c, maxAge){
  var out = [], from = Math.max(2, c.length - (maxAge || 60));
  for (var i = from; i < c.length; i++){
    var a = c[i - 2], b = c[i];
    if (b.l > a.h) out.push({ dir: 1, lo: a.h, hi: b.l, i: i, t: b.t });
    else if (b.h < a.l) out.push({ dir: -1, lo: b.h, hi: a.l, i: i, t: b.t });
  }
  return out.filter(function(g){
    for (var j = g.i + 1; j < c.length; j++){
      if (g.dir === 1 && c[j].l <= g.lo) return false;
      if (g.dir === -1 && c[j].h >= g.hi) return false;
    }
    return true;
  });
}

// ---- Zeit (Berlin)
function berlinParts(ms){
  var f = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Berlin', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', weekday: 'short', hourCycle: 'h23' });
  var p = {}; f.formatToParts(new Date(ms)).forEach(function(x){ p[x.type] = x.value; });
  return { key: p.year + '-' + p.month + '-' + p.day, hh: +p.hour, mm: +p.minute, wd: p.weekday, min: (+p.hour) * 60 + (+p.minute) };
}
// Vortag, heute, Asien-Range (00:00-08:00 Berlin) aus Intraday-Kerzen
function dayLevels(c, now){
  var today = berlinParts(now).key, days = {}, order = [];
  var wk = {};
  c.forEach(function(x){ var b = berlinParts(x.t), k = b.key; if (!days[k]){ days[k] = []; order.push(k); wk[k] = b.wd; } days[k].push(x); });
  // Vortag = letzter Handelstag (Wochenend-Reste wie die Freitag-23-Uhr-Kerze zaehlen nicht)
  var prevKey = order.filter(function(k){ return k < today && wk[k] !== 'Sat' && wk[k] !== 'Sun'; }).pop();
  var rng = function(arr){ return arr && arr.length ? { hi: Math.max.apply(null, arr.map(function(x){ return x.h; })), lo: Math.min.apply(null, arr.map(function(x){ return x.l; })) } : null; };
  var td = days[today] || [];
  var asia = td.filter(function(x){ return berlinParts(x.t).hh < 8; });
  return { prev: rng(days[prevKey]), today: rng(td), asia: rng(asia), prevKey: prevKey, todayKey: today };
}
// Handelszeiten fuer Daytrader (Berlin)
function sessionInfo(now, instr){
  var b = berlinParts(now), m = b.min, zone = (instr && instr.zone) || 'eu';
  if (b.wd === 'Sat' || (b.wd === 'Sun' && m < 23 * 60) || (b.wd === 'Fri' && m >= 23 * 60)) return { label: 'Wochenende', q: -2, text: 'Markt geschlossen' };

// ---------- Risiko-Simulation (Monte Carlo aus den Rueckrechnungs-Trades)
function simRisk(rs, perYear, riskPct, runs){

}

      '<div class="btns"><button class="btn ghost block" data-act="ptest">Test senden</button><button class="btn ghost block" data-act="poff">Ausschalten</button></div>'
      : '<div class="btns"><button class="btn block" data-act="pon"' + (canPush ? '' : ' disabled') + '>Benachrichtigungen einschalten</button></div>') +
    (V.pushMsg ? '<p class="' + (/^Fehler|nicht/.test(V.pushMsg) ? 'err' : 'hint') + '">' + esc(V.pushMsg) + '</p>' : '') + '</section>';
  h += '<section class="card"><h2>Datendienst</h2><p class="hint" style="margin-top:4px">' + (base() ? 'Verbunden: ' + esc(base().replace('https://', '')) : 'Wird automatisch aus deiner Value-Slip-Einrichtung übernommen …') + '</p>' +
    '<details class="more"><summary>Adresse selbst eintragen</summary><label class="field txt" style="margin-top:8px"><span>Adresse des Dienstes</span><input data-cfg="url" value="' + esc(c.url) + '" placeholder="https://value-slip.….workers.dev" autocapitalize="off" autocorrect="off"></label></details></section>';
  h += '<section class="card"><h2>Über Trade Check</h2><p class="hint" style="margin-top:4px">Trade Check bestätigt dein Setup mit Daten: Kurse von Yahoo Finance (bei manchen Börsen leicht verzögert), Termine von Forex Factory, Positionierung der Großspekulanten aus dem COT-Bericht der CFTC (wöchentlich). Die Entscheidung bleibt bei dir.</p>' +
    '<p class="hint"><a class="link" href="../">Zu Value Slip</a></p></section>';
  return h;
}
// ---------- Push
function token(){ if (!S.cfg.token){ var a = new Uint8Array(20); crypto.getRandomValues(a); S.cfg.token = Array.prototype.map.call(a, function(x){ return ('0' + x.toString(16)).slice(-2); }).join(''); save(); } return S.cfg.token; }
function b64u(s){ var p = '='.repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')), o = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) o[i] = b.charCodeAt(i); return o; }
function post(path, body){
  var u = base(); if (!u) return Promise.reject(new Error('Datendienst nicht eingerichtet.'));
  return fetch(u + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ if (!r.ok) throw new Error(j.message || ('Fehler ' + r.status)); return j; }); });
}
function syncBody(extra){

  return Object.assign({ token: token(), acct: +S.cfg.account || 0, risk: +S.cfg.risk || 0, heat: +S.cfg.heat || 5, etf: S.cfg.push.etf !== false, ccys: ccyList(), kw: kw, lead: S.cfg.push.lead, kz: S.cfg.push.kz, on: S.cfg.push.on, watch: S.watch.slice(0, 8), scan: S.cfg.push.scan !== false, orb: S.cfg.push.orb !== false, ibs: S.cfg.push.ibs !== false, depot: S.cfg.push.depot !== false, brief: S.cfg.push.brief !== false, bgreen: S.cfg.push.bgreen !== false, swing: S.cfg.push.swing !== false, scanAll: S.cfg.push.quality === 'all', quality: 'creme', trades: trades, alerts: S.alerts.filter(function(a){ return !a.dead || Date.now() - a.since < 86400e3; }).slice(0, 20).map(function(a){ return { id: a.id, kind: a.kind, sym: a.sym, name: a.name, lo: a.lo, hi: a.hi, note: a.note, since: a.since, hit: a.hit, dir: a.dir, entry: a.entry, stop: a.stop, target: a.target, exp: a.exp, mode: a.mode, ccy: a.ccy, dec: a.dec, dead: a.dead }; }) }, extra || {});
}
function syncTrade(extra){
  if (!S.cfg.push.on && !(extra && extra.sub)) return Promise.resolve(null);
  return post('/trade/sync', syncBody(extra)).then(function(j){
    V.lastSync = Date.now();
    var hits = {}, deads = {}; (j.alerts || []).forEach(function(a){ if (a.hit) hits[a.id] = a; if (a.dead) deads[a.id] = a.dead; });
    var changed = false;
    S.alerts.forEach(function(a){ if (hits[a.id] && !a.hit){ a.hit = hits[a.id].hit; a.hitPx = hits[a.id].hitPx; changed = true; } if (deads[a.id] && !a.dead){ a.dead = deads[a.id]; changed = true; } });
    V.signals = j.signals || []; V.tev = j.tev || {}; V.track = j.track || []; V.trackLog = j.trackLog || []; V.swingPos = j.swingPos || []; V.ibsPos = j.ibsPos || []; V.brief = j.brief || null; appBadge();
    if (V.wantSig){ var w = V.wantSig; V.wantSig = null; useSignal(w); return j; }

function pushOn(){
  V.pushMsg = 'Einen Moment …'; rerender();

  Promise.resolve().then(function(){ return Notification.requestPermission(); }).then(function(perm){
    if (perm !== 'granted') throw new Error('Mitteilungen wurden nicht erlaubt. Einstellungen → Mitteilungen → Trade Check.');
    return navigator.serviceWorker.ready;
  }).then(function(r){ reg = r; return api('/trade/key', 3600e3); }).then(function(k){
    return reg.pushManager.getSubscription().then(function(old){ return old || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(k.key) }); });
  }).then(function(sub){
    S.cfg.push.on = true; save();

  }).then(function(){ V.pushMsg = 'Benachrichtigungen sind an.'; S.cfg.push.on = true; save(); rerender(); })
    .catch(function(e){ S.cfg.push.on = false; save(); V.pushMsg = 'Fehler: ' + e.message; rerender(); });

// ---------- Ereignisse
function chartTap(ev){
  var svg = ev.currentTarget, m = V.chartMap; if (!m) return;
  var r = svg.getBoundingClientRect(), yy = (ev.clientY - r.top) / r.height * m.H;
  var p = m.hi - (yy - m.padT) / (m.H - m.padT - m.padB) * (m.hi - m.lo);
  // nahe an einer Zonen-Kante: genau deren Marktpreis nehmen
  var snap = (m.hi - m.lo) * 0.03, best = null;
  (V.zones || []).forEach(function(z){ [z.ch, z.cl].forEach(function(v, k){ var dd = Math.abs(v - p); if (dd < snap && (!best || dd < best.d)) best = { d: dd, p: k ? z.lo : z.hi }; }); });
  var i = instr(S.form.k); V.pick = +(best ? best.p : p + (m.off || 0)).toFixed(i.dec); rerender();
}
function bind(root){

    if (el.dataset.f === 'entry' || el.dataset.f === 'stop'){ var kb = $('.kobox'), i = instr(S.form.k); if (kb && i){ var w = document.createElement('div'); w.innerHTML = viewKo(S.form, i); var nb = w.firstChild; kb.replaceWith(nb); bind(nb); } } }); });
  $$('input[data-cfg]', root).forEach(function(el){ el.addEventListener('change', function(){ var k = el.dataset.cfg; if (k === 'url'){ S.cfg.url = el.value.trim(); mem = {}; } else { var v = pnum(el.value); if (v >= 0) S.cfg[k] = v; } save(); if (['account', 'risk', 'heat'].indexOf(k) >= 0) syncTrade().catch(function(){}); rerender(); }); });
  $$('input[data-watch]', root).forEach(function(el){ el.addEventListener('change', function(){ var k = el.dataset.watch, i = S.watch.indexOf(k); if (el.checked && i < 0) S.watch.push(k); if (!el.checked && i >= 0) S.watch.splice(i, 1); save(); syncTrade(); }); });
  $$('input[data-push]', root).forEach(function(el){ el.addEventListener('change', function(){ S.cfg.push[el.dataset.push] = el.checked; save(); syncTrade(); }); });
  $$('input[data-fib]', root).forEach(function(el){ el.addEventListener('input', function(){ S.fib[el.dataset.fib] = el.value; save(); }); });
}
function setField(f, p){

}

  if (a === 'ptest'){ V.pushMsg = 'Sende …'; rerender(); post('/trade/test', { token: token() }).then(function(j){ V.pushMsg = j.status >= 200 && j.status < 300 ? 'Test gesendet. Kommt gleich an.' : 'Fehler: Apple meldet ' + j.status; rerender(); }).catch(function(err){ V.pushMsg = 'Fehler: ' + err.message; rerender(); }); }
}
