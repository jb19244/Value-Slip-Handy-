<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trade Check</title>
<meta name="description" content="Bestätigung für Daytrading-Setups: Struktur, Liquidität, News, Handelszeit, COT und Positionsgröße mit Live-Daten.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --bg:#000000; --surface:#111214; --surface2:#1D1E22; --fg:#F5F5F7; --muted:#8E8E93; --line:#26272B;
  --accent:#F5F5F7; --accent-fg:#000000; --link:#7FB2FF;
  --good:#2FD07A; --good-bg:rgba(47,208,122,.14); --bad:#FF5A5F; --bad-bg:rgba(255,90,95,.14); --warn:#FFB340; --warn-bg:rgba(255,179,64,.14);
  --overlay:rgba(0,0,0,.7);
  --font-d:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',system-ui,sans-serif;
  --font-b:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
html{height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 var(--font-b);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--fg)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{height:100%;display:flex;flex-direction:column;min-height:0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:10px;border-bottom:1px solid var(--line);background:var(--bg)}
.brand{display:flex;align-items:center;gap:7px;font-family:var(--font-d);font-weight:700;font-size:19px;letter-spacing:-.01em;white-space:nowrap}
.brand svg{width:20px;height:20px;color:var(--good)}
.chip{display:flex;align-items:center;gap:7px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13px;color:var(--muted);min-width:0}
.chip b{font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.good{background:var(--good)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.page{display:flex;flex-direction:column;gap:14px;padding-block:16px 28px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:rgba(10,10,12,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);padding-top:6px;padding-bottom:max(6px,env(safe-area-inset-bottom,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;font-size:12px;font-weight:500;color:var(--muted)}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--fg)}
.tab[aria-selected="true"] svg{stroke-width:2.2}
.card{background:var(--surface);border:0;border-radius:18px;padding:16px;min-width:0}
h2{margin:0;font-family:var(--font-d);font-weight:700;font-size:20px;letter-spacing:-.01em}
h3{margin:0;font-size:15px;font-weight:600}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.label{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--muted)}
.hint{margin:8px 0 0;font-size:13px;color:var(--muted)}
.err{margin:8px 0 0;font-size:13px;color:var(--bad);font-weight:500}
.num{font-family:var(--font-d);font-variant-numeric:tabular-nums;font-weight:600}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.seg{display:flex;gap:2px;padding:3px;background:var(--surface2);border-radius:11px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(12,26,38,.18)}
.seg.dir button[data-dir="1"][aria-pressed="true"]{background:var(--good);color:var(--bg)}
.seg.dir button[data-dir="-1"][aria-pressed="true"]{background:var(--bad);color:var(--bg)}
.field input::placeholder{color:var(--muted);opacity:.45}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;font-weight:600;font-size:15px;background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.good-bg{background:var(--good-bg);color:var(--good)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.block{flex:1}
.btn[disabled]{opacity:.5}
.btns{display:flex;gap:10px;margin-top:14px}
.link{color:var(--link);font-weight:600}
.scroller{display:flex;gap:8px;overflow-x:auto;margin:0 -14px;padding:2px 14px 4px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.ichip{flex:none;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:14px;white-space:nowrap}
.ichip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:12px}
.price b{font-family:var(--font-d);font-size:40px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field span{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select{width:100%;min-width:0;height:46px;border:1px solid var(--line);border-radius:11px;background:var(--bg);padding:0 10px;font-family:var(--font-d);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.field select{font-family:var(--font-b);font-size:15px}
.field.txt input{font-family:var(--font-b);font-size:15px;font-weight:500}
.f2{grid-template-columns:repeat(2,minmax(0,1fr))}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{padding:6px 10px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--muted);background:var(--bg)}
.tag[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
details.more{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
details.more summary{list-style:none;cursor:pointer;font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+";font-size:20px;color:var(--muted)}
details.more[open] summary::after{content:"−"}
.verdict{display:flex;align-items:center;gap:14px;padding:16px;border-radius:14px}
.verdict.gruen{background:var(--good-bg);color:var(--good)} .verdict.gelb{background:var(--warn-bg);color:var(--warn)} .verdict.rot{background:var(--bad-bg);color:var(--bad)}
.lamp{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;background:currentColor}
.lamp svg{width:30px;height:30px;stroke:var(--surface);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.verdict .big{font-family:var(--font-d);font-size:30px;font-weight:700;line-height:1;letter-spacing:.03em;text-transform:uppercase}
.verdict p{margin:4px 0 0;font-size:14px;color:var(--fg)}
.items{list-style:none;margin:12px 0 0;padding:0}
.item{display:grid;grid-template-columns:24px minmax(0,1fr);gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item i{grid-row:1 / span 2;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:700;margin-top:1px}
.item i.pro{background:var(--good-bg);color:var(--good)} .item i.contra{background:var(--bad-bg);color:var(--bad)} .item i.warn{background:var(--warn-bg);color:var(--warn)} .item i.neutral{background:var(--surface2);color:var(--muted)}
.item b{font-size:14px} .item span{font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin:12px 0 0}
.kv dt{font-size:12px;color:var(--muted)} .kv dd{margin:0;font-family:var(--font-d);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ladder{list-style:none;margin:10px 0 0;padding:0}
.lv{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.lv:last-child{border-bottom:0}
.lv .n{font-size:13px;overflow-wrap:anywhere} .lv .p{font-family:var(--font-d);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.hero{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.hero div{background:var(--bg);border-radius:12px;padding:10px;min-width:0}
.hero dt{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.hero dd{margin:2px 0 0;font-family:var(--font-d);font-size:20px;white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.guard{margin-top:10px;padding:10px 12px;border-radius:12px;font-size:14px;font-weight:600}
.guard.ok{background:var(--good-bg);color:var(--good)} .guard.stop{background:var(--bad-bg);color:var(--bad)}
.ihead{padding:4px 0 2px}
.ihead .nm{font-size:15px;font-weight:600;color:var(--muted)}
.bigpx{font-family:var(--font-d);font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.chg{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.buysell{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.buysell button{min-height:54px;border-radius:14px;font-size:17px;font-weight:700;background:var(--surface2);color:var(--muted)}
.buysell button[data-dir="1"][aria-pressed="true"]{background:var(--good);color:#00140A}
.buysell button[data-dir="-1"][aria-pressed="true"]{background:var(--bad);color:#1A0003}
.bias.wl{display:grid;grid-template-columns:38px minmax(0,1fr) 64px auto;grid-template-rows:auto;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.bias.wl:last-child{border-bottom:0}
.bias.wl .px{text-align:right;font-size:16px}
.logo{width:38px;height:38px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--fg)}
.wl .nm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl .rt{text-align:right}
.wl .px{font-family:var(--font-d);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.cpill{display:inline-block;margin-top:3px;padding:2px 7px;border-radius:7px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.cpill.good{background:var(--good-bg);color:var(--good)} .cpill.bad{background:var(--bad-bg);color:var(--bad)}
.mini{width:64px;height:28px;display:block}
.depot{padding:6px 0 4px}
.depot .bigpx{font-size:40px}
.lv .acts{display:flex;gap:4px}
.lv .acts button{width:30px;height:30px;border-radius:8px;background:var(--surface2);font-size:12px;font-weight:700;color:var(--muted)}
.lv.now{background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:8px;padding-inline:8px;margin-inline:-8px}
.lv.now .n{color:var(--accent);font-weight:600}
.bias{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.bias:last-child{border-bottom:0}
.bias .nm{font-weight:600} .bias .px{text-align:right;font-family:var(--font-d);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.bias .sub{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.bias .ch{text-align:right;font-size:13px;font-weight:600}
.daybar{position:relative;height:30px;border-radius:8px;background:var(--surface2);margin-top:12px;overflow:hidden}
.daybar span{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden}
.daybar .asia{background:color-mix(in srgb,var(--muted) 22%,transparent)}
.daybar .kz{background:color-mix(in srgb,var(--accent) 35%,transparent)}
.daybar .now{width:2px;background:var(--bad);z-index:2}
.dayaxis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.ev{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:start}
.ev:last-child{border-bottom:0}
.ev .t{font-family:var(--font-d);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.ev.past{opacity:.55}
.ev .ti{font-size:14px;font-weight:500;overflow-wrap:anywhere} .ev .fc{font-size:12px;color:var(--muted)}
.trade{padding:12px 0;border-bottom:1px solid var(--line)}
.trade:last-child{border-bottom:0}
.spark{width:100%;height:80px;margin-top:10px}
table.st{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
table.st th{font-weight:600;color:var(--muted);text-align:right;padding:4px 0 6px;font-size:12px}
table.st th:first-child,table.st td:first-child{text-align:left}
table.st th+th{padding-left:8px}
table.st td{padding:6px 0;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
table.st td:first-child{overflow-wrap:anywhere;padding-right:8px}
.sheet-bg{position:fixed;inset:0;background:var(--overlay);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:16px 16px max(18px,env(safe-area-inset-bottom,0px))}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:30;max-width:calc(100% - 32px)}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;padding:6px 0}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.switch input{width:46px;height:28px;appearance:none;-webkit-appearance:none;border-radius:999px;background:var(--surface2);position:relative;flex:none;border:1px solid var(--line)}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.switch input:checked{background:var(--accent);border-color:var(--accent)}
.switch input:checked::after{left:20px}
.list-plain{list-style:none;margin:8px 0 0;padding:0}
.list-plain li{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.list-plain li:last-child{border-bottom:0}
.chart{width:100%;height:240px;display:block;margin-top:10px;touch-action:manipulation;border-radius:10px;background:var(--bg)}
.chart text{font-family:var(--font-b);font-size:9px;fill:var(--muted)}
.zones{display:grid;grid-template-columns:1fr;gap:4px;margin-top:8px}.zone{display:flex;align-items:center;gap:4px;font-size:12px;font-variant-numeric:tabular-nums}.zone .zn{font-weight:700;min-width:64px}.zone button{flex:1}.zone button{background:var(--surface2);border:0;color:var(--fg);border-radius:6px;padding:5px 6px;font:inherit;font-size:12px}.zone button[aria-pressed=true]{background:var(--link);color:#000}.zone button.zo{flex:0 0 auto;color:var(--link)}.ovl{position:fixed;inset:0;z-index:50;background:var(--bg,#000);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 8px)}.pro-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}.pro-top b{font-size:17px}.pro-px{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted)}.pro-x{background:var(--surface,#111);border:0;color:var(--fg);width:36px;height:36px;border-radius:18px;font-size:16px}.pro-cv{flex:1;min-height:200px;position:relative;margin-top:8px}.pro-cv canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}.pro-info{font-size:12px;color:var(--muted);padding:8px 2px;min-height:32px;font-variant-numeric:tabular-nums}.pro-act{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.pro-ly{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.pro-ly button{background:var(--surface,#111);color:var(--muted);border:1px solid #2A2D33;border-radius:14px;padding:6px 10px;font-size:12px}.pro-ly button[aria-pressed=true]{color:#000;background:var(--link,#7FB2FF);border-color:transparent}.rd{list-style:none;margin:8px 0 6px;padding:0;display:flex;flex-direction:column;gap:9px}.rd li{display:grid;grid-template-columns:minmax(0,1.1fr) 1fr 38px;gap:10px;align-items:center;font-size:14px}.rd-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rd-b{position:relative;height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}.rd-b i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--muted);opacity:.55}.rd-b i.near{background:var(--warn);opacity:.9}.rd-b i.on{background:var(--good);opacity:1}.rd-b em{position:absolute;left:20%;top:0;bottom:0;width:2px;background:var(--fg);opacity:.7}.rd-v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}.rd-sum{font-size:14px;margin:6px 0 2px;line-height:1.4}.rd-vix{display:flex;justify-content:space-between;font-size:13px;padding-top:10px;margin-top:8px;border-top:1px solid var(--line)}

<script>
/*@@LOGIC@@*/

// ===================== App =====================
var LS = 'tradecheck.v1';
var SMC_TAGS = ['Order Block', 'Fair Value Gap', 'Liquidity Sweep', 'BOS', 'CHoCH', 'Breaker', 'Premium/Discount', 'OTE (62–79 %)'];
var EW_TAGS = ['Welle 3', 'Welle 5', 'Welle C', 'ABC-Korrektur', 'Fib-Ziel'];
function defaults(){
  return { cfg: { account: 5000, risk: 1, fee: 1, maxTrades: 2, maxLossR: 2, url: '', token: '', push: { on: false, lead: 15, kz: true, scan: true, scanAll: false, quality: 'creme', qv2: true, qv3: true, qv4: true, qv5: true } },
    form: { k: 'EURUSD', dir: 1, entry: '', stop: '', target: '', setups: [], ratio: '', ko: '', bid: '', ask: '' },
    watch: ['EURUSD', 'XAUUSD', 'DAX', 'NDX'], names: {}, trades: [], alerts: [], tab: 'heute', fib: { a: '', b: '', c: '' }, ko: {}, tf: '15m', pro: null, real: {}, imp: [], train: [], onb: 0 };
}
function load(){
  var d = defaults();
  try { var s = JSON.parse(localStorage.getItem(LS) || 'null'); if (s && typeof s === 'object'){ Object.keys(d).forEach(function(k){ if (s[k] != null) d[k] = s[k]; }); d.cfg = Object.assign(defaults().cfg, s.cfg || {}); d.cfg.push = Object.assign(defaults().cfg.push, (s.cfg || {}).push || {}); d.form = Object.assign(defaults().form, s.form || {}); } } catch (e) {}
  return d;
}
var S = load();
if (!S.cfg.push.qv4){ S.cfg.push.quality = 'mix'; S.cfg.push.qv2 = S.cfg.push.qv3 = S.cfg.push.qv4 = true; }
S.cfg.push.quality = 'creme'; S.cfg.push.qv5 = true;
var V = { signals: [], tev: {}, bt: null, pick: null, dienst: null, check: null, checkErr: '', busy: false, data: {}, rates: null, cal: null, calErr: '', cot: {}, lastSync: 0, pushMsg: '' };
function save(){ try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }
function $(s, r){ return (r || document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function pnum(v){ var n = parseFloat(String(v == null ? '' : v).replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : null; }
function fmt(x, dec){ if (x == null || !isFinite(x)) return '–'; var s = Math.abs(x).toFixed(dec == null ? 2 : dec).split('.'); s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.'); return (x < 0 ? '−' : '') + s.join(','); }
function fmtIn(x, dec){ return x == null || !isFinite(x) ? '' : (+x).toFixed(dec).replace('.', ','); }
function eur(x){ return fmt(x, 2) + ' €'; }
function sgn(x, dec){ return (x > 0 ? '+' : '') + fmt(x, dec); }
function hm(ms){ return new Intl.DateTimeFormat('de-DE', { timeZone: 'Europe/Berlin', hour: '2-digit', minute: '2-digit' }).format(new Date(ms)); }
function dm(ms){ return new Intl.DateTimeFormat('de-DE', { timeZone: 'Europe/Berlin', weekday: 'short', day: '2-digit', month: '2-digit' }).format(new Date(ms)); }
function dur(ms){ var m = Math.max(0, Math.round(ms / 60000)); return m < 60 ? m + ' Min' : Math.floor(m / 60) + ' Std' + (m % 60 ? ' ' + (m % 60) + ' Min' : ''); }
function instr(k){ var i = instrumentByKey(k); if (i && i.type === 'stock' && S.names[k]) i = Object.assign({}, i, { name: S.names[k] }); return i; }
function toast(msg){ $$('.toast').forEach(function(x){ x.remove(); }); var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 2600); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

// ---------- Dienst und Daten
function loadDienst(){
  if (V.dienst) return V.dienst;
  V.dienst = fetch('../dienst/status.json', { cache: 'no-cache' }).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });
  return V.dienst;
}
var dienstUrl = '';
function base(){ return (S.cfg.url || dienstUrl || '').replace(/\/+$/, ''); }
var mem = {};
function api(path, ttl){
  var u = base();
  if (!u){
    // Adresse kommt evtl. gleich aus status.json: kurz darauf warten statt sofort einen Fehler zu zeigen
    if (V.dienst && !V.dienstWaited){ return V.dienst.then(function(){ V.dienstWaited = true; return api(path, ttl); }); }
    return Promise.reject(new Error('Der Datendienst ist noch nicht eingerichtet (siehe Mehr).'));
  }
  var m = mem[path];
  if (m && Date.now() - m.at < ttl) return m.p;
  var p = fetch(u + path).then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ if (!r.ok) throw new Error(j.message || ('Datendienst antwortet mit ' + r.status)); return j; }); });
  mem[path] = { at: Date.now(), p: p };
  p.catch(function(){ if (mem[path] && mem[path].p === p) delete mem[path]; });
  return p;
}
function candles(sym, iv, rg){ return api('/mkt/chart?sym=' + encodeURIComponent(sym) + '&interval=' + iv + '&range=' + rg, iv === '1d' ? 20 * 60e3 : (iv === '60m' ? 4 * 60e3 : 50e3)).then(parseYahoo); }
function getRates(){
  return Promise.all(['EURUSD=X', 'JPY=X', 'GBPUSD=X'].map(function(s){ return candles(s, '60m', '5d').catch(function(){ return []; }); })).then(function(r){
    var last = function(c){ return c.length ? c[c.length - 1].c : null; };
    V.rates = { EURUSD: last(r[0]), USDJPY: last(r[1]), GBPUSD: last(r[2]) };
    return V.rates;
  });
}
function getCal(){ return api('/mkt/cal', 10 * 60e3).then(function(j){ V.cal = j.events || []; V.calErr = ''; return V.cal; }).catch(function(e){ V.calErr = e.message; return null; }); }
function getCot(i){
  if (!i.cot) return Promise.resolve(null);
  var key = 'tc.cot.' + i.cot;
  try { var c = JSON.parse(localStorage.getItem(key) || 'null'); if (c && Date.now() - c.at < 12 * 3600e3) return Promise.resolve(cotIndex(c.rows, i.cotSign)); } catch (e) {}
  return api('/mkt/cot?code=' + i.cot, 12 * 3600e3).then(function(j){ try { localStorage.setItem(key, JSON.stringify({ at: Date.now(), rows: j.rows })); } catch (e) {} return cotIndex(j.rows, i.cotSign); }).catch(function(){ return null; });
}
// Alle Daten fuer ein Instrument
function instData(k, force){
  var i = instr(k); if (!i) return Promise.reject(new Error('Unbekanntes Instrument'));
  if (force) Object.keys(mem).forEach(function(p){ if (p.indexOf(encodeURIComponent(i.y)) >= 0) delete mem[p]; });
  return Promise.all([candles(i.y, '15m', '5d'), candles(i.y, '60m', '1mo'), candles(i.y, '1d', '2y'), i.bench ? candles(i.bench, '1d', '1mo').catch(function(){ return null; }) : null, getCot(i)]).then(function(r){
    var d = { m15: r[0], h1: r[1], d1: r[2], bench: r[3], cot: r[4], at: Date.now() };
    if (!d.m15.length && !d.h1.length) throw new Error('Keine Kursdaten für ' + i.name + '. Prüfe das Symbol.');
    V.data[k] = d; return d;
  });
}
function lastPx(d){ var c = d && (d.m15 && d.m15.length ? d.m15 : d.h1); return c && c.length ? c[c.length - 1].c : null; }
function dayChg(d){ if (!d || !d.d1 || d.d1.length < 2) return null; var px = lastPx(d) || d.d1[d.d1.length - 1].c; var prev = d.d1[d.d1.length - 2].c; var lastDay = berlinParts(d.d1[d.d1.length - 1].t).key; if (lastDay !== berlinParts(Date.now()).key) prev = d.d1[d.d1.length - 1].c; return px / prev - 1; }

// ---------- Kopfzeile: Handelszeit
function renderSess(){
  var i = instr(S.form.k) || INSTRUMENTS[0], s = sessionInfo(Date.now(), i);
  $('#sess').innerHTML = '<span class="dot ' + (s.q > 0 ? 'good' : (s.q <= -2 ? 'bad' : (s.q < 0 ? 'warn' : ''))) + '"></span><b>' + esc(s.label) + '</b>';
}

// ---------- Navigation
function setTab(t){ S.tab = t; save(); render(); $('#main').scrollTop = 0; }
function render(){
  $$('.tab').forEach(function(b){ b.setAttribute('aria-selected', String(b.dataset.tab === S.tab)); });
  renderSess();
  var p = $('#page');
  if (S.tab === 'heute') p.innerHTML = viewHeute();
  else if (S.tab === 'check') p.innerHTML = viewCheck();
  else if (S.tab === 'markt') p.innerHTML = viewFinder() + viewMarkt();
  else if (S.tab === 'buch') p.innerHTML = viewBuch();
  else p.innerHTML = viewMehr();
  after();
}
function after(){
  // nur einmal je Instrument automatisch laden (nach einem Fehler erst wieder per Knopf oder Wechsel)
  if (S.tab === 'check' && !V.data[S.form.k] && !V.loading && V.tried !== S.form.k + '|' + base()){ V.tried = S.form.k + '|' + base(); loadInst(S.form.k); }
  if (S.tab === 'markt' || S.tab === 'heute') loadMarkt();
  if (S.tab === 'heute'){ loadOpen(); loadCtx(); }
  if (S.tab === 'buch') loadOpen();
}

// ===================== Check =====================
function watchKeys(){ var ks = S.watch.slice(); if (ks.indexOf(S.form.k) < 0) ks.unshift(S.form.k); return ks; }
function viewCheck(){

  if (a === 'tf'){ S.tf = el.dataset.tf; V.pick = null; save(); return rerender(); }
  if (a === 'usesig') return useSignal(el.dataset.id);
  if (a === 'finder') return finderLoad(true);
  if (a === 'realyes'){ var tl = (V.trackLog || []).filter(function(x){ return x.id === el.dataset.id; })[0]; if (!tl) return;
    sheet('<h2>' + esc(tl.name) + ' gehandelt</h2><p class="hint">Signal ' + sgn(tl.r, 2) + ' R, nach Plan etwa ' + sgn(tl.r * riskEur() - (+S.cfg.fee || 0) * 2, 0) + ' €. Trag dein echtes Ergebnis ein, oder lass das Feld leer, dann zählt der Planwert.</p><div class="fields f2"><label class="field"><span>Ergebnis in €</span><input inputmode="decimal" id="realeur" placeholder="z. B. 42,50 oder -20"></label></div><div class="btns"><button class="btn block" data-act="realsave" data-id="' + esc(tl.id) + '">Speichern</button></div>');
    return; }
  if (a === 'realsave'){ var ve = $('#realeur') ? String($('#realeur').value).trim() : ''; S.real[el.dataset.id] = { traded: true, eur: ve === '' ? null : numDE(ve) }; save(); closeSheet(); toast('Gespeichert'); return rerender(); }
  if (a === 'realno'){ S.real[el.dataset.id] = { traded: false }; save(); return rerender(); }
  if (a === 'realimp'){ var fi = $('#realfile'); if (fi) fi.click(); return; }
  if (a === 'realclr'){ S.imp = []; save(); return rerender(); }
  if (a === 'train') return trainOpen();
  if (a === 'inbox') return inboxSheet();
  if (a === 'msg') return openMsg(el.dataset.id || null, el.dataset.at);
  if (a === 'msguse') return msgUse(findMsg(el.dataset.id || null, el.dataset.at));
  if (a === 'toaudit'){ setTab('buch'); setTimeout(function(){ var el2 = $('#audit'); if (el2) el2.scrollIntoView({ block: 'start' }); }, 60); return; }
  if (a === 'pro') return proOpen(el.dataset.k || S.form.k);
  if (a === 'finderuse') return useSignal(el.dataset.id);
  if (a === 'sigall'){ V.sigAll = !V.sigAll; return rerender(); }
  if (a === 'quality'){ S.cfg.push.quality = el.dataset.q; save(); syncTrade(); return rerender(); }
  if (a === 'tevclose'){ var tt = S.trades.filter(function(x){ return x.id === el.dataset.id; })[0], ev = V.tev[el.dataset.id]; if (tt && ev) return closeTrade(tt.id, ev.done === 'ziel' ? tt.target : tt.stop); return; }
  if (a === 'run') return runCheck();
  if (a === 'open'){ var tsx = todayState(), r0 = V.check || {}, nx = (V.cal || []).filter(function(e){ var tt = Date.parse(e.date); return e.impact === 'High' && tt > Date.now() - 15 * 60e3 && tt < Date.now() + 30 * 60e3; })[0];
    var items = ['Das Setup erfüllt die Regeln, nicht nur mein Gefühl.', 'Der Stop steht beim Broker, nicht nur im Kopf.', 'Positionsgröße wie berechnet' + (r0.ps ? ' (Risiko ' + eur(r0.ps.riskEur) + ')' : '') + '.', 'Ich handle nicht aus Frust, Langeweile oder Angst etwas zu verpassen.'];
    if (nx) items.splice(2, 0, 'Termin ' + hm(Date.parse(nx.date)) + ' ' + nx.country + ' ' + nx.title + ' ist mir bewusst.');
    sheet('<h2>Vor dem Klick</h2>' + (tsx.stop ? '<div class="banner bad" style="margin-bottom:8px"><span>' + esc(tsx.stop) + '</span></div>' : '') + '<ul class="pf">' + items.map(function(x, k){ return '<li><label><input type="checkbox" class="pfc" data-n="' + k + '"> <span>' + esc(x) + '</span></label></li>'; }).join('') + '</ul><div class="btns"><button class="btn block" data-act="opengo" disabled>Ins Tagebuch</button></div>');
    $$('.pfc').forEach(function(c){ c.addEventListener('change', function(){ var b = $('[data-act=opengo]'); if (b) b.disabled = $$('.pfc').some(function(x){ return !x.checked; }); }); });
    return; }
  if (a === 'opengo'){ closeSheet(); return openTrade(); }
  if (a === 'alarm') return addAlarmAtEntry();
  if (a === 'fib') return fibSheet();
  if (a === 'fibcalc') return fibSheet();
  if (a === 'fibauto'){ var i0 = instr(S.form.k); S.fib.a = fmtIn(V.fibAuto.a, i0.dec); S.fib.b = fmtIn(V.fibAuto.b, i0.dec); S.fib.c = ''; save(); return fibSheet(); }
  if (a === 'fibset'){ setField(el.dataset.f, el.dataset.p); return; }
  if (a === 'fibstop'){ var pa = pnum(S.fib.a); if (pa) setField('stop', pa); return; }
  if (a === 'tab') return setTab(el.dataset.t);
  if (a === 'aladd') return alarmSheet();
  if (a === 'alsave'){
    var lo = pnum($('#alo').value), hi = pnum($('#ahi').value);
    if (!(lo > 0)) return toast('Bitte eine Zone eintragen');
    if (!(hi > 0)) hi = lo; if (hi < lo){ var tmp = lo; lo = hi; hi = tmp; }
    var ins = instr(S.form.k);
    S.alerts.unshift({ id: uid(), k: S.form.k, sym: ins.y, name: ins.name, lo: lo, hi: hi, note: $('#ano').value.trim().slice(0, 40), since: Date.now(), hit: 0 });
    save(); closeSheet(); syncTrade(); return rerender();
  }
  if (a === 'aldel'){ S.alerts = S.alerts.filter(function(x){ return x.id !== el.dataset.id; }); save(); syncTrade(); return rerender(); }
  if (a === 'close'){
    var tr = S.trades.filter(function(x){ return x.id === el.dataset.id; })[0]; if (!tr) return;
    return closeTrade(tr.id, { target: tr.target, stop: tr.stop, be: tr.entry }[el.dataset.how]);
  }
  if (a === 'closex'){
    var t2 = S.trades.filter(function(x){ return x.id === el.dataset.id; })[0], i2 = instr(t2.instr) || { dec: 2 }, live = lastPx(V.data[t2.instr]);
    sheet('<h2>Trade schließen</h2><p class="hint">' + esc(t2.name) + ' ' + (t2.dir > 0 ? 'Long' : 'Short') + ' ab ' + fmt(t2.entry, i2.dec) + '</p><div class="fields f2"><label class="field"><span>Ausstiegskurs</span><input inputmode="decimal" id="xp" value="' + (live ? fmtIn(live + (t2.off || 0), i2.dec) : '') + '"></label></div><div class="btns"><button class="btn block" data-act="closego" data-id="' + t2.id + '">Schließen</button></div>');
    return;
  }
  if (a === 'closego') return closeTrade(el.dataset.id, pnum($('#xp').value));
  if (a === 'tdel'){ S.trades = S.trades.filter(function(x){ return x.id !== el.dataset.id; }); save(); return rerender(); }
  if (a === 'csv') return csv();
  if (a === 'risk'){ S.cfg.risk = +el.dataset.r; save(); syncTrade().catch(function(){}); return rerender(); }
  if (a === 'lead'){ S.cfg.push.lead = +el.dataset.m; save(); syncTrade(); return rerender(); }
  if (a === 'pon') return pushOn();
  if (a === 'poff'){ post('/trade/sync', syncBody({ off: true, on: false })).catch(function(){}); S.cfg.push.on = false; V.pushMsg = ''; save(); return rerender(); }
  if (a === 'ptest'){ V.pushMsg = 'Sende …'; rerender(); post('/trade/test', { token: token() }).then(function(j){ V.pushMsg = j.status >= 200 && j.status < 300 ? 'Test gesendet. Kommt gleich an.' : 'Fehler: Apple meldet ' + j.status; rerender(); }).catch(function(err){ V.pushMsg = 'Fehler: ' + err.message; rerender(); }); }
}
$$('.tab').forEach(function(b){ b.addEventListener('click', function(){ setTab(b.dataset.tab); }); });
var _render = render;
render = function(){ _render(); bind($('#page')); };

// ---------- Start
try { var qs = new URLSearchParams(location.search).get('sig'); if (qs) V.wantSig = qs; } catch (e) {}
fetch('../dienst/backtest-fx.json', { cache: 'no-cache' }).then(function(r){ return r.ok ? r.json() : null; }).then(function(b){ if (b && b.tf){ V.bf = b; if (S.tab === 'buch') rerender(); } }).catch(function(){});
fetch('../dienst/backtest-scalp.json', { cache: 'no-cache' }).then(function(r){ return r.ok ? r.json() : null; }).then(function(b){ if (b && b.sets){ V.bs = b; if (S.tab === 'buch') rerender(); } }).catch(function(){});
fetch('../dienst/backtest-cal.json', { cache: 'no-cache' }).then(function(r){ return r.ok ? r.json() : null; }).then(function(b){ if (b && b.sets){ V.bc = b; if (S.tab === 'buch' || S.tab === 'heute') rerender(); } }).catch(function(){});
fetch('../dienst/backtest-pro.json', { cache: 'no-cache' }).then(function(r){ return r.ok ? r.json() : null; }).then(function(b){ if (b && b.sets){ V.bp = b; if (S.tab === 'buch') rerender(); } }).catch(function(){});
fetch('../dienst/backtest-more.json', { cache: 'no-cache' }).then(function(r){ return r.ok ? r.json() : null; }).then(function(b){ if (b && b.sets){ V.bm = b; if (S.tab === 'buch' || S.tab === 'heute') rerender(); } }).catch(function(){});
fetch('../dienst/backtest-extra.json', { cache: 'no-cache' }).then(function(r){ return r.ok ? r.json() : null; }).then(function(b){ if (b && b.sets){ V.bx = b; if (S.tab === 'buch') rerender(); } }).catch(function(){});
fetch('../dienst/backtest-1h.json', { cache: 'no-cache' }).then(function(r){ return r.ok ? r.json() : null; }).then(function(b){ if (b && b.grades){ V.bt1 = b; if (S.tab === 'buch' || S.tab === 'markt') rerender(); } }).catch(function(){});
fetch('../dienst/backtest.json', { cache: 'no-cache' }).then(function(r){ return r.ok ? r.json() : null; }).then(function(b){ if (b && b.all){ delete b.trades; V.bt = b; if (S.tab === 'buch' || S.tab === 'markt') rerender(); } }).catch(function(){});
loadDienst().then(function(s){ if (s && s.ok && s.url) dienstUrl = s.url; render(); if (S.cfg.push.on) syncTrade(); });
render();
if (!S.onb && !S.trades.length && !S.cfg.push.on && !window.__noOnb) onbShow(0);
pushStart();
setInterval(renderSess, 30000);
document.addEventListener('visibilitychange', function(){ if (!document.hidden){ if (S.cfg.push.on && Date.now() - V.lastSync > 60e3) syncTrade(); if (S.tab === 'markt' || S.tab === 'buch') after(); } });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
