<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Value Slip</title>
<meta name="description" content="Value-Bet-Rechner: findet Wetten mit Value gegenüber Pinnacle und baut die besten Kombischeine.">
<meta name="theme-color" content="#F0F2F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0F1D" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Value Slip">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: One-Screen-App. Kopfzeile, scrollender Inhalt, Tab-Leiste unten. Ticket-Optik fuer den Schein. */
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --bg:#F0F2F9; --surface:#FFFFFF; --surface2:#E6E9F5; --fg:#10142B; --muted:#586088; --line:#D7DBEC;
  --accent:#3446E0; --accent-fg:#FFFFFF;
  --good:#0B8556; --good-bg:#DCF2E6; --bad:#C0392F; --bad-bg:#F8E2DF; --warn:#8A5700; --warn-bg:#FBEBCB;
  --overlay:rgba(16,20,43,.45);
  --font-d:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --font-b:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C0F1D; --surface:#151A2E; --surface2:#1E2442; --fg:#EDEFFA; --muted:#9BA2C8; --line:#272E50;
    --accent:#8190FF; --accent-fg:#0C0F1D;
    --good:#4AD494; --good-bg:#12342A; --bad:#FF8379; --bad-bg:#3B1E26; --warn:#F2BE5C; --warn-bg:#3A2D12;
    --overlay:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C0F1D; --surface:#151A2E; --surface2:#1E2442; --fg:#EDEFFA; --muted:#9BA2C8; --line:#272E50;
  --accent:#8190FF; --accent-fg:#0C0F1D;
  --good:#4AD494; --good-bg:#12342A; --bad:#FF8379; --bad-bg:#3B1E26; --warn:#F2BE5C; --warn-bg:#3A2D12;
  --overlay:rgba(0,0,0,.6); color-scheme:dark;
}
html{height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 var(--font-b);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.app{height:100%;display:flex;flex-direction:column;min-height:0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:10px;border-bottom:1px solid var(--line);background:var(--bg)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-d);font-weight:700;font-size:24px;letter-spacing:.05em;text-transform:uppercase}
.brand svg{width:22px;height:22px;color:var(--accent)}
.chip{display:flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13px;color:var(--muted)}
.chip b{font-family:var(--font-d);font-size:17px;font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums}
main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.page{display:flex;flex-direction:column;gap:14px;padding-block:16px 24px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding-top:6px;padding-bottom:max(6px,env(safe-area-inset-bottom,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;font-size:12px;font-weight:500;color:var(--muted)}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
h2{margin:0;font-family:var(--font-d);font-weight:600;font-size:22px;letter-spacing:.02em}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hint{margin:8px 0 0;font-size:13px;color:var(--muted)}

.seg{display:flex;gap:2px;padding:3px;background:var(--surface2);border-radius:11px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted);min-height:38px}
.seg.sm button{font-size:13px;padding:8px 2px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(16,20,43,.18)}
.filters{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.stepper{display:flex;flex-direction:column;gap:6px;min-width:0}
.stepper .ctl{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:11px;background:var(--bg)}
.stepper .ctl button{width:42px;height:42px;font-size:22px;color:var(--accent);font-weight:500}
.stepper .ctl output{font-family:var(--font-d);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}

.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.banner{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 12px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font-size:13px;font-weight:500}
.banner button{font-weight:600;text-decoration:underline;white-space:nowrap}

.ticket{position:relative;padding:0}
.t-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 14px 0}
.t-chips{display:flex;gap:6px}
.t-chips button{min-width:34px;height:30px;border-radius:8px;border:1px solid var(--line);font-family:var(--font-d);font-size:17px;font-weight:600;color:var(--muted)}
.t-chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.t-odds{display:flex;align-items:baseline;gap:10px;padding:6px 14px 0}
.t-odds b{font-family:var(--font-d);font-weight:700;font-size:68px;line-height:1;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin:12px 0 0;padding:0 14px 16px}
.stats div{min-width:0}
.stats dt{font-size:12px;color:var(--muted)}
.stats dd{margin:0;font-family:var(--font-d);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.stats dd.good{color:var(--good)} .stats dd.bad{color:var(--bad)}
.sep{position:relative;border-top:2px dashed var(--line)}
.sep::before,.sep::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg)}
.sep::before{left:-11px} .sep::after{right:-11px}
.legs{list-style:none;margin:0;padding:6px 14px 0}
.leg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.leg:last-child{border-bottom:0}
.leg .pick{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.leg .game{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.leg .q{grid-row:1 / span 3;grid-column:2;text-align:right}
.leg .q b{display:block;font-family:var(--font-d);font-size:28px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.leg .q span{display:inline-block;margin-top:4px}
.leg .fair{grid-column:1;font-size:12px;color:var(--muted)}
.t-foot{display:flex;gap:10px;padding:8px 14px 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;font-weight:600;font-size:15px;background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.block{flex:1}
.empty{text-align:center;padding:26px 16px}
.empty p{margin:8px 0 16px;color:var(--muted)}
.singles{display:flex;flex-direction:column;margin-top:8px}
.singles .leg{padding:10px 0}
.legs.singles.top{padding:0;margin-top:4px}
.foot{font-size:12px;color:var(--muted);line-height:1.5;padding:0 2px}

.games{display:flex;flex-direction:column;gap:10px}
.gcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.g-meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-bottom:6px}
.g-meta span{min-width:0;overflow-wrap:anywhere}
.g-meta > :last-child{flex:none;white-space:nowrap}
.g-teams{font-weight:600;font-size:16px;margin-bottom:10px;overflow-wrap:anywhere}
.g-odds{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.g-odds + .g-odds{margin-top:8px}
.cell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:10px;background:var(--surface2);min-width:0}
.cell small{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
.cell b{font-family:var(--font-d);font-size:24px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.cell em{font-style:normal;font-size:12px;font-weight:600;color:var(--muted)}
.cell.good{background:var(--good-bg)} .cell.good em,.cell.good b{color:var(--good)}
.cell.bad em{color:var(--bad)}
.gcard.done{opacity:.55;cursor:default}
.g-foot{margin-top:10px;font-size:13px;font-weight:600;color:var(--accent)}
.cell.empty-c{background:transparent;border:1px dashed var(--line)}
.label.lg{margin:6px 2px -2px}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:0 2px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
.dot.old{background:var(--warn)}
.notes{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.notes summary{cursor:pointer;font-weight:600;color:var(--fg)}
.notes p{margin:8px 0 0;line-height:1.5}
.refline{font-size:11px;color:var(--muted);line-height:1.3}
.sub{margin:-6px 0 14px;font-size:15px;overflow-wrap:anywhere}
.status .grow{flex:1;min-width:0}
.link{color:var(--accent);font-weight:600;font-size:13px;padding:6px 0 6px 8px;white-space:nowrap}
.link[disabled]{opacity:.5}
.dot.busy{background:var(--accent)}
@media (prefers-reduced-motion:no-preference){.dot.busy{animation:pulse 1s ease-in-out infinite}@keyframes pulse{50%{opacity:.3}}}
.banner.err-b{background:var(--bad-bg);color:var(--bad)}
.setup{display:flex;flex-direction:column;gap:8px}
.setup p{margin:0}
.group.api,.group.pushg{gap:10px}
.keyrow{display:flex;gap:8px}
.keyrow input{flex:1;min-width:0}
.btn.sm{min-height:46px;padding:0 12px;font-size:14px}
.lg-group{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.lchip{padding:8px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--muted);background:var(--bg)}
.lchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.cell .pr{font-weight:700;color:var(--fg);margin-left:4px}
.cell .pr::before{content:"· ";font-weight:400;color:var(--muted)}
.g-foot.muted-foot{color:var(--muted);font-weight:500}
.neg{margin:0;padding:0 14px 14px;font-size:13px;color:var(--bad);font-weight:500}
.olist{display:flex;flex-direction:column;gap:8px}
.orow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.orow .ol{display:flex;flex-direction:column;gap:1px;min-width:0}
.orow .ol b{font-size:15px;overflow-wrap:anywhere}
.orow .ol small{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.orow .ol i{font-style:normal;font-weight:600;color:var(--warn)}
.orow .orr{display:flex;flex-direction:column;align-items:flex-end;flex:none}
.orow .orr b{font-family:var(--font-d);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.orow .orr em{font-style:normal;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.orow .orr em.good{color:var(--good)} .orow .orr em.bad{color:var(--bad)}
details.xmore{margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
details.xmore summary{cursor:pointer;font-weight:600}
details.xmore .xg{margin:12px 0 8px}
.lg-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 2px -2px}
.lg-head .link{padding:4px 0;font-size:12px}
.nofx{font-size:13px;color:var(--muted);padding:6px 0 2px}
.refgrp{background:var(--surface2);border-radius:12px;padding:12px;margin-bottom:6px}
.t-foot .btn{font-size:14px;padding:0 12px}
.bets{display:flex;flex-direction:column;gap:10px}
.bet .row{gap:8px}
.blegs{list-style:none;margin:8px 0;padding:0;display:flex;flex-direction:column;gap:8px}
.blegs li{display:flex;align-items:center;justify-content:space-between;gap:10px}
.blegs .bl{display:flex;flex-direction:column;min-width:0}
.blegs .bl small{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.lst{display:flex;gap:6px;flex:none}
.mini{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);color:var(--muted);font-weight:700}
.mini.on.good{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.mini.on.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.kv dd.good{color:var(--good)} .kv dd.bad{color:var(--bad)}
.bact{margin-top:4px}
.recs{display:flex;flex-direction:column;gap:10px}
button.card.rec{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left}
.rtitle{display:flex;flex-direction:column;gap:2px;min-width:0}
.rtitle b{font-size:16px}
.rtitle small{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.rnums{display:flex;flex-direction:column;align-items:flex-end;flex:none;gap:2px}
.rnums b{font-family:var(--font-d);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.rnums small{font-size:12px;color:var(--muted);white-space:nowrap}
.ticket.rec .t-head{align-items:flex-start}
.tune{display:flex;flex-direction:column;gap:6px}
.rule b{color:var(--accent);font-weight:600}
.refl{font-size:12px;color:var(--muted);margin:2px 0 6px;font-variant-numeric:tabular-nums;line-height:1.4}
.refl b{color:var(--fg);font-weight:600}
.autob{font-weight:600;color:var(--accent)}
.btl{font-size:11px;font-weight:600;color:var(--muted);margin-top:4px} input.bt{background:var(--surface)} .refline.cmp b{font-weight:700} .refline.cmp b.good{color:var(--good)}
.bto{display:block;font-style:normal;font-size:11px;line-height:1.25;color:var(--muted);margin-top:3px;text-align:center} .bto.win{color:var(--good);font-weight:700}
.fairb{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.02em;padding:1px 6px;border-radius:6px;background:var(--surface2);color:var(--fg)}
.pinb{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.02em;padding:1px 6px;border-radius:6px;background:var(--good-bg);color:var(--good)}
input.o.auto{color:var(--muted)}
.label.sub{margin-top:6px;font-size:11px}
.cell.est b{font-weight:600}
.estnote{margin:8px 0 0;font-size:13px;color:var(--warn);line-height:1.4}
.xload{display:flex;flex-direction:column;gap:6px;margin:4px 0 10px}
.add{border:1.5px dashed var(--line);border-radius:14px;min-height:50px;color:var(--accent);font-weight:600}

.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields.c3{grid-template-columns:repeat(3,1fr)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.wide{grid-column:1 / -1}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input{width:100%;min-height:46px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:16px}
.field input.o{font-family:var(--font-d);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.group{display:flex;flex-direction:column;gap:10px}
.group + .group,.fields + .group{margin-top:16px}
.result{display:flex;flex-direction:column;gap:12px}
.verdict{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:12px;font-weight:600}
.verdict.good{background:var(--good-bg);color:var(--good)} .verdict.bad{background:var(--bad-bg);color:var(--bad)} .verdict.warn{background:var(--warn-bg);color:var(--warn)}
.verdict b{font-family:var(--font-d);font-size:30px;font-variant-numeric:tabular-nums}
.guide{margin:8px 0 0;padding-left:20px;font-size:14px;line-height:1.5} .guide li{margin:0 0 10px} .guide code{font-size:13px;background:var(--surface2);padding:1px 5px;border-radius:5px;word-break:break-all}
.manual{margin:10px 0 0;font-size:14px} .manual summary{color:var(--accent);font-weight:600;padding:6px 0;cursor:pointer}
.plog{list-style:none;margin:0;padding:0;font-size:13px} .plog li{padding:4px 0;border-bottom:1px solid var(--line)}
.ana h3{margin:0 0 6px;font-size:15px}
.ana .chart{width:100%;height:auto;display:block;touch-action:pan-y}
.ana .lgd{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:6px 0 0}
.ana .lgd i{display:inline-block;width:16px;height:0;border-top:2px solid var(--accent);vertical-align:middle;margin-right:5px}
.ana .lgd i.ex{border-top:2px dashed var(--muted)} .ana .lgd i.bd{height:9px;border:0;background:var(--surface2);border-radius:2px}
.ana .tip{font-size:12px;color:var(--fg);min-height:16px;margin:4px 0 0;font-variant-numeric:tabular-nums}
.atbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;margin-top:10px}
.atbl th{font-weight:600;color:var(--muted);font-size:12px;text-align:right;padding:4px 4px;border-bottom:1px solid var(--line)}
.atbl td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.atbl th:first-child,.atbl td:first-child{text-align:left;padding-left:0}
.atbl td.good{color:var(--good)} .atbl td.bad{color:var(--bad)}
.ana .verd{font-size:13px;margin:8px 0 0}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin:0}
.kv dt{font-size:12px;color:var(--muted)} .kv dd{margin:0;font-family:var(--font-d);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}

.overlay{position:fixed;inset:0;z-index:20;background:var(--overlay);display:flex;align-items:flex-end}
.sheet{width:100%;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding-top:10px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h2{margin-bottom:14px}
.sheet .actions{display:flex;gap:10px;margin-top:18px}
.err{margin:10px 0 0;color:var(--bad);font-size:13px;font-weight:500}

<body>

<div id="toast" class="toast" hidden></div>

<script>
(function(){
'use strict';
// BEGIN LOGIC
function parseNum(v){ var n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isFinite(n) ? n : NaN; }

var SPORTS = {
  fb: { name: 'Fußball',    unit: 'Tore',    ph: '2,5' },
  bb: { name: 'Basketball', unit: 'Punkte',  ph: '224,5' },
  ih: { name: 'Eishockey',  unit: 'Tore',    ph: '5,5' }
};

// Wahrscheinlichkeiten ohne Buchmacher-Marge. prop = proportional, power = Potenz-Methode (beruecksichtigt Favoriten-Aussenseiter-Verzerrung)
function fairProbs(odds, method){
  var inv = odds.map(function(o){ return 1 / o; });
  var s = inv.reduce(function(a, b){ return a + b; }, 0);
  if (method === 'prop' || s <= 1) return inv.map(function(x){ return x / s; });
  var lo = 1, hi = 12;
  for (var i = 0; i < 70; i++){
    var k = (lo + hi) / 2;
    var f = inv.reduce(function(a, x){ return a + Math.pow(x, k); }, 0);
    if (f > 1) lo = k; else hi = k;
  }
  var kk = (lo + hi) / 2;
  var p = inv.map(function(x){ return Math.pow(x, kk); });
  var t = p.reduce(function(a, b){ return a + b; }, 0);
  return p.map(function(x){ return x / t; });
}

// Nur halbe Linien (2,5 / 5,5 / 224,5): kein Push, also genau zwei Ausgaenge.
function isHalfLine(line){
  if (!(line > 0)) return false;
  var d = line * 2;
  return Math.abs(d - Math.round(d)) < 1e-9 && Math.round(d) % 2 === 1;
}
function fmtLine(line){ return String(line).replace('.', ','); }
// Handicap-Linie mit Vorzeichen: -5.5 -> "−5,5", 1.5 -> "+1,5"
function fmtHc(line){ return line === 0 ? '0' : (line > 0 ? '+' : '−') + fmtLine(Math.abs(line)); }
function isHcLine(line){ return typeof line === 'number' && isHalfLine(Math.abs(line)); }
// Asiatisches Handicap (Fussball): Viertel-, halbe und ganze Linien bis +-5
function isAhLine(line){ return typeof line === 'number' && isFinite(line) && Math.abs(line) <= 5 && Math.abs(line * 4 - Math.round(line * 4)) < 1e-9; }
function hcLineOk(sport, line){ return (sport || 'fb') === 'fb' ? isAhLine(line) : isHcLine(line); }

var MARKETS = { res: 'Ergebnis', dc: 'Doppelte Chance', ou: 'Über/Unter', hc: 'Handicap', x: 'Weitere Märkte' };

// Torverteilungsmodell (Dixon-Coles): Torerwartung beider Teams so bestimmen, dass das Modell die marginfreien
// Marktchancen fuer 1, X, 2 und Ueber/Unter trifft. Daraus folgen Chancen fuer weitere Fussballmaerkte.
var DC_RHO = -0.06, MAXG = 10;
function poissonPmf(l){ var p = [Math.exp(-l)]; for (var k = 1; k <= MAXG; k++) p[k] = p[k - 1] * l / k; return p; }
function scoreMatrix(lh, la){
  var ph = poissonPmf(lh), pa = poissonPmf(la), M = [], tot = 0;
  for (var i = 0; i <= MAXG; i++){
    M[i] = [];
    for (var j = 0; j <= MAXG; j++){
      var t = 1;
      if (i === 0 && j === 0) t = 1 - lh * la * DC_RHO; else if (i === 0 && j === 1) t = 1 + lh * DC_RHO;
      else if (i === 1 && j === 0) t = 1 + la * DC_RHO; else if (i === 1 && j === 1) t = 1 - DC_RHO;
      M[i][j] = Math.max(0, ph[i] * pa[j] * t); tot += M[i][j];
    }
  }
  for (i = 0; i <= MAXG; i++) for (j = 0; j <= MAXG; j++) M[i][j] /= tot;
  return M;
}
function sumWhere(M, f){ var s = 0; for (var i = 0; i <= MAXG; i++) for (var j = 0; j <= MAXG; j++) if (f(i, j)) s += M[i][j]; return s; }
function modelErr(M, tg){
  var e = Math.pow(sumWhere(M, function(i, j){ return i > j; }) - tg.h, 2) + Math.pow(sumWhere(M, function(i, j){ return i === j; }) - tg.d, 2) +
          Math.pow(sumWhere(M, function(i, j){ return i < j; }) - tg.a, 2);
  if (tg.ouLine != null) e += Math.pow(sumWhere(M, function(i, j){ return i + j > tg.ouLine; }) - tg.ouP, 2);
  return e;
}
var fitCache = {};
function fitGoals(tg){
  var ck = [tg.h, tg.d, tg.a, tg.ouLine, tg.ouP].map(function(x){ return x == null ? '-' : x.toFixed(6); }).join('|');
  if (fitCache[ck]) return fitCache[ck];
  var x = [Math.log(1.4), Math.log(1.1)], step = 0.5;
  var cur = modelErr(scoreMatrix(Math.exp(x[0]), Math.exp(x[1])), tg);
  for (var it = 0; it < 400 && step > 1e-5; it++){
    var improved = false;
    for (var d = 0; d < 2; d++) for (var sg = -1; sg <= 1; sg += 2){
      var y = x.slice(); y[d] += sg * step;
      if (y[d] < Math.log(0.05) || y[d] > Math.log(6)) continue;
      var e = modelErr(scoreMatrix(Math.exp(y[0]), Math.exp(y[1])), tg);
      if (e < cur){ cur = e; x = y; improved = true; }
    }
    if (!improved) step /= 2;
  }
  var res = { lh: Math.exp(x[0]), la: Math.exp(x[1]), M: scoreMatrix(Math.exp(x[0]), Math.exp(x[1])), err: Math.sqrt(cur / (tg.ouLine != null ? 4 : 3)) };
  var keys = Object.keys(fitCache); if (keys.length > 300) fitCache = {};
  fitCache[ck] = res;
  return res;
}
// Weitere Fussballmaerkte mit Modell-Chance. Nur halbe Linien, also immer genau Gewinn oder Verlust.
// Faire Chancen aus geladenen Pinnacle-Paaren (z. B. Beide treffen Ja/Nein), Schluessel wie in extraMarkets
function pinExtraProbs(m, method){
  var out = {};
  (Array.isArray(m.xpairs) ? m.xpairs : []).forEach(function(pr){
    if (!pr || !Array.isArray(pr.keys) || !Array.isArray(pr.odds) || pr.odds.length !== 2 || !(pr.odds[0] > 1 && pr.odds[1] > 1)) return;
    var f = fairProbs(pr.odds, method);
    pr.keys.forEach(function(k, i){ if (k && f[i] > 0.001 && f[i] < 0.999) out[k] = f[i]; });
  });
  return out;
}
function extraMarkets(m, method){
  var ref = m.ref || {};
  if ((m.sport || 'fb') !== 'fb' || !(ref.h > 1 && ref.d > 1 && ref.a > 1)) return [];
  var f = fairProbs([ref.h, ref.d, ref.a], method);
  var tg = { h: f[0], d: f[1], a: f[2], ouLine: null, ouP: null };
  if (m.ou && isHalfLine(m.ou.line) && m.ou.ref && m.ou.ref.o > 1 && m.ou.ref.u > 1){ tg.ouLine = m.ou.line; tg.ouP = fairProbs([m.ou.ref.o, m.ou.ref.u], method)[0]; }
  var fit = fitGoals(tg), M = fit.M, H = m.home, A = m.away;
  var P = function(fn){ return sumWhere(M, fn); };
  var out = [];
  // Vorsichtsabschlag: Modell-Chancen sind unsicherer als Marktquoten (ohne Ue/U-Markt noch mehr)
  var unc = 0.02 + fit.err + (tg.ouLine == null ? 0.03 : 0);
  // Geladene Pinnacle-Quoten fuer weitere Maerkte ersetzen die Modell-Chance (ohne Abschlag, es ist der Markt selbst)
  var pin = pinExtraProbs(m, method);
  var add = function(key, group, label, p){
    if (pin[key] != null){ out.push({ key: key, group: group, label: label, praw: pin[key], p: pin[key], model: false }); return; }
    if (p > 0.001 && p < 0.999) out.push({ key: key, group: group, label: label, praw: p, p: Math.max(0.002, p - unc), model: true });
  };
  [0.5, 1.5, 2.5, 3.5, 4.5].forEach(function(L){
    if (tg.ouLine === L) return;
    var po = P(function(i, j){ return i + j > L; }), k = String(L).replace('.', '');
    add('o' + k, 'Tore', 'Über ' + fmtLine(L) + ' Tore', po); add('u' + k, 'Tore', 'Unter ' + fmtLine(L) + ' Tore', 1 - po);
  });
  var bt = P(function(i, j){ return i > 0 && j > 0; });
  add('btsy', 'Beide treffen', 'Beide treffen: Ja', bt); add('btsn', 'Beide treffen', 'Beide treffen: Nein', 1 - bt);
  add('h05', 'Team-Tore', H + ' trifft (Über 0,5)', P(function(i){ return i > 0; }));
  add('h15', 'Team-Tore', H + ' Über 1,5 Tore', P(function(i){ return i > 1; }));
  add('a05', 'Team-Tore', A + ' trifft (Über 0,5)', P(function(i, j){ return j > 0; }));
  add('a15', 'Team-Tore', A + ' Über 1,5 Tore', P(function(i, j){ return j > 1; }));
  var hm = P(function(i, j){ return i - j >= 2; }), am = P(function(i, j){ return j - i >= 2; });
  add('hm15', 'Handicap', H + ' −1,5', hm); add('ap15', 'Handicap', A + ' +1,5', 1 - hm);
  add('am15', 'Handicap', A + ' −1,5', am); add('hp15', 'Handicap', H + ' +1,5', 1 - am);
  add('ho15', 'Kombi', H + ' siegt & Über 1,5', P(function(i, j){ return i > j && i + j > 1; }));
  add('ao15', 'Kombi', A + ' siegt & Über 1,5', P(function(i, j){ return j > i && i + j > 1; }));
  add('hxu35', 'Kombi', H + ' oder Remis & Unter 3,5', P(function(i, j){ return i >= j && i + j < 4; }));
  add('xau35', 'Kombi', 'Remis oder ' + A + ' & Unter 3,5', P(function(i, j){ return j >= i && i + j < 4; }));
  out.fitErr = fit.err; out.lh = fit.lh; out.la = fit.la; out.unc = unc; out.noOu = tg.ouLine == null;
  return out;
}
var DC_KEYS = ['hx', 'xa', 'ha'];

function selectionsFor(m, method){
  var out = [];
  var sport = m.sport && SPORTS[m.sport] ? m.sport : 'fb';
  var sp = SPORTS[sport];
  var prov = m.bookName || 'Betano';
  // Wettsteuer des Anbieters: Anteil der Auszahlung, der bei dir ankommt (Betano: 0,947; bet365: 1)
  var tf = m.taxF > 0 && m.taxF <= 1 ? m.taxF : 1;
  var base = { mid: m.id, game: m.home + ' – ' + m.away, league: m.league, lkey: m.lkey || '', kickoff: m.kickoff || null, sport: sport, sample: !!m.sample, prov: prov };
  var ref = m.ref || {}, book = m.book || {};
  var push = function(market, key, label, p, b, line){
    var tag = market + '.' + key;
    var src = (m.ovf && m.ovf[tag]) ? prov : ((m.bsrc && m.bsrc[tag]) || prov);
    out.push(Object.assign({}, base, { market: market, key: key, label: label, p: p, fairOdds: 1 / p, book: b, tf: tf, evRaw: p * b - 1, ev: p * b * tf - 1, src: src, line: line == null ? null : line }));
  };
  // Ergebnis-Markt
  if (ref.h > 1 && ref.a > 1){
    var three = ref.d > 1;
    var keys = three ? ['h', 'd', 'a'] : ['h', 'a'];
    var fair = fairProbs(keys.map(function(k){ return ref[k]; }), method);
    keys.forEach(function(k, i){
      var b = book[k];
      if (!(b > 1)) return;
      push('res', k, k === 'h' ? m.home : (k === 'a' ? m.away : 'Unentschieden'), fair[i], b);
    });
    // Doppelte Chance (nur Fussball): Chance = Summe zweier fairer 1X2-Chancen
    if (sport === 'fb' && three && m.dc){
      var pdc = { hx: fair[0] + fair[1], xa: fair[1] + fair[2], ha: fair[0] + fair[2] };
      var ldc = { hx: m.home + ' oder Remis', xa: 'Remis oder ' + m.away, ha: m.home + ' oder ' + m.away };
      DC_KEYS.forEach(function(k){
        var b = m.dc && m.dc[k];
        if (b > 1 && pdc[k] < 1) push('dc', k, ldc[k], pdc[k], b);
      });
    }
  }
  // Handicap (Basketball, Eishockey): Linie gilt fuer das Heimteam, nur halbe Linien (kein Push)
  var hc = m.hc;
  // Fussball: asiatisches Handicap auch mit Viertel- und ganzen Linien. Dort ist die "Chance" die faire Chance ohne
  // Rueckerstattungen (aus Pinnacle ohne Marge); Value = Quote / faire Quote - 1, wie im Markt ueblich.
  if (hc && hcLineOk(sport, hc.line) && hc.ref && hc.ref.h > 1 && hc.ref.a > 1){
    var fh = fairProbs([hc.ref.h, hc.ref.a], method);
    var split = !isHalfLine(Math.abs(hc.line));
    if (hc.book && hc.book.h > 1){ push('hc', 'h', m.home + ' ' + fmtHc(hc.line), fh[0], hc.book.h, hc.line); out[out.length - 1].split = split; }
    if (hc.book && hc.book.a > 1){ push('hc', 'a', m.away + ' ' + fmtHc(-hc.line), fh[1], hc.book.a, hc.line); out[out.length - 1].split = split; }
  }
  // Ueber/Unter-Markt
  var ou = m.ou;
  if (ou && isHalfLine(ou.line) && ou.ref && ou.ref.o > 1 && ou.ref.u > 1){
    var f = fairProbs([ou.ref.o, ou.ref.u], method);
    [['o', 'Über', 0], ['u', 'Unter', 1]].forEach(function(t){
      var b = ou.book && ou.book[t[0]];
      if (b > 1) push('ou', t[0], t[1] + ' ' + fmtLine(ou.line) + ' ' + sp.unit, f[t[2]], b, ou.line);
    });
  }
  return out;
}

function passes(sel, st){
  return (!st.sport || st.sport === 'all' || sel.sport === st.sport) &&
         (!st.market || st.market === 'all' || sel.market === st.market);
}

var MODES = {
  hit:      { name: 'Treffer',    leg: function(s){ return s.ev >= -0.05; },                  score: function(p, o){ return p; } },
  safe:     { name: 'Sicher',     leg: function(s){ return s.ev >= 0 && s.p >= 0.5; },        score: function(p, o){ return p; } },
  balanced: { name: 'Ausgewogen', leg: function(s, st){ return s.ev >= st.minEdge; },        score: function(p, o){ return p; } },
  value:    { name: 'Value',      leg: function(s, st){ return s.ev >= st.minEdge; },        score: function(p, o){ return p * o - 1; } }
};

// Pro Spiel hoechstens ein Tipp: alle Maerkte desselben Spiels haengen zusammen.
// Exakte Suche mit Schranken (Branch and Bound): jeder Tipp jedes Spiels wird beruecksichtigt,
// Aeste werden nur abgeschnitten, wenn sie beweisbar keinen besseren Schein mehr liefern koennen.
var MAX_MATCHES = 60;
// Sicherheitsnetz: bei kuenstlich gleichfoermigen Daten (viele exakt gleiche Spiele) stoppt die Suche nach so vielen Schritten
// und liefert die besten bis dahin gefundenen Scheine (approx = true). Bei echten Spieltagen wird die Grenze nicht erreicht.
var SEARCH_BUDGET = 1500000;
function buildSlips(matches, st){
  var mode = MODES[st.mode];
  var byP = st.mode !== 'value';
  var cands = [], singles = [];
  matches.forEach(function(m){
    var list = selectionsFor(m, st.devig).filter(function(x){ return passes(x, st) && mode.leg(x, st); });
    list.forEach(function(x){ singles.push(x); });
    if (!list.length) return;
    list.sort(byP ? function(a, b){ return (b.p - a.p) || (b.ev - a.ev); } : function(a, b){ return (b.ev - a.ev) || (b.p - a.p); });
    cands.push(list);
  });
  singles.sort(function(a, b){ return b.ev - a.ev; });
  // Bei mehr als MAX_MATCHES Spielen: in Chance-Modi die Spiele mit den sichersten Tipps behalten, sonst die mit dem meisten Value
  var bestOf = function(l){ return l.reduce(function(a, x){ return Math.max(a, byP ? x.p : x.ev); }, -1); };
  cands.sort(function(a, b){ return bestOf(b) - bestOf(a); });
  cands = cands.slice(0, MAX_MATCHES);
  var n = cands.length, K = st.maxLegs;
  // Fuer jede Startposition i: die groessten Quoten bzw. Value-Faktoren der restlichen Spiele (je Spiel das Maximum), absteigend
  var sufBook = [], sufFac = [];
  for (var i = n; i >= 0; i--){
    var bk = [], fc = [];
    for (var j = i; j < n; j++){
      var mb = 1, mf = 1;
      cands[j].forEach(function(x){ if (x.book > mb) mb = x.book; if (1 + x.ev > mf) mf = 1 + x.ev; });
      bk.push(mb); fc.push(mf);
    }
    bk.sort(function(a, b){ return b - a; }); fc.sort(function(a, b){ return b - a; });
    sufBook[i] = bk; sufFac[i] = fc;
  }
  var prodTop = function(arr, k){ var r = 1; for (var q = 0; q < k && q < arr.length; q++) r *= arr[q]; return r; };
  var top = [], steps = 0, approx = false;
  function cmp(a, b){ return (b.score - a.score) || (b.ev - a.ev); }
  function consider(legs, odds, p){
    var sl = { legs: legs.slice(), odds: odds, p: p, ev: p * odds - 1, score: mode.score(p, odds) };
    if (top.length < 3 || cmp(sl, top[top.length - 1]) < 0){
      top.push(sl); top.sort(cmp); if (top.length > 3) top.pop();
    }
  }
  function dfs(i, chosen, odds, p){
    if (++steps > SEARCH_BUDGET){ approx = true; return; }
    if (chosen.length && odds >= st.target - 1e-9) consider(chosen, odds, p);
    var left = K - chosen.length;
    if (left <= 0 || i >= n) return;
    // Zielquote mit den verbleibenden Tipps ueberhaupt erreichbar?
    if (odds * prodTop(sufBook[i], left) < st.target - 1e-9) return;
    if (top.length === 3){
      var worst = top[2].score;
      var fac = prodTop(sufFac[i], left);
      // Chance-Modi: jeder Tipp hat Chance = (1 + Value) / Quote. Wer noch den Faktor target/odds an Quote braucht,
      // verliert mindestens diesen Faktor an Chance, gewinnt aber hoechstens die besten Value-Faktoren zurueck.
      // Value-Modus: der Score steigt hoechstens um die besten verbleibenden Value-Faktoren.
      var bound = byP ? p * Math.min(1, odds >= st.target ? 1 : fac * odds / st.target) : p * odds * fac - 1;
      if (bound <= worst + 1e-15) return;
    }
    for (var j = i; j < n; j++){
      for (var c = 0; c < cands[j].length; c++){
        var s = cands[j][c];
        chosen.push(s);
        dfs(j + 1, chosen, odds * s.book, p * s.p);
        chosen.pop();
      }
    }
  }
  dfs(0, [], 1, 1);
  return { slips: top, singles: singles, approx: approx };
}

// Feste Regel fuer die besten Wetten (keine Zielquote, keine Modi):
// 1. Nur 2er- und 3er-Kombis, pro Spiel hoechstens ein Tipp.
// 2. Jeder Tipp braucht mindestens den Mindest-Value (Einstellung, Standard 2 %) und eine Quote ab RULE.minLeg.
// 3. Gesamtquote mindestens RULE.minSlip.
// 4. Rangfolge: erwartetes Bankroll-Wachstum (Kelly-Wachstum) mit dem Einsatz, den die App empfiehlt.
//    Das gewichtet Trefferchance und Value gemeinsam: hoher Value bei kleiner Chance zaehlt weniger als
//    etwas weniger Value bei deutlich hoeherer Chance.
// 5. Hoechstens 3 Scheine; zwei Scheine teilen sich hoechstens einen Tipp, damit sie wirklich verschieden sind.
var RULE = { minLeg: 1.2, minSlip: 1.5, minLegs: 2, maxLegs: 3, show: 3, maxCands: 150, pool: 60 };
// Zweite feste Regel "Hohe Trefferchance": jeder Tipp mit mindestens 60 % Chance und nicht negativem Value (0 % oder mehr),

var TAX_RATE = 0.053;
var DEFAULT_TAX = { Betano: true, bet365: false };
function taxOn(book){ var t = state.settings.tax || {}; return book in t ? !!t[book] : !!DEFAULT_TAX[book]; }

function feedMatches(){
  if (!state.feed) return [];

}

// Eingetragene Betano-Quoten als eigener Anbieter (Kombis bleiben je Anbieter getrennt, Betano mit Wettsteuer)
function betanoQuotes(m){
  var bt = (state.ov[m.id] || {}).bt;
  if (!bt || bookFor(m.sport) === 'Betano') return null;
  var g = function(t){ return bt[t] > 1 ? bt[t] : null; };

    ou: m.ou ? Object.assign({}, m.ou, { book: bt.ouLine === m.ou.line ? { o: g('ou.o'), u: g('ou.u') } : { o: null, u: null } }) : null,
    hc: m.hc ? Object.assign({}, m.hc, { book: bt.hcLine === m.hc.line ? { h: g('hc.h'), a: g('hc.a') } : { h: null, a: null } }) : null,
    bsrc: {}, ovf: {}, bookName: 'Betano', taxF: taxFor('Betano'), btClone: true });

}

// Empfehlungen nach fester Regel (siehe bestBets): bis zu 3 verschiedene 2er-/3er-Kombis mit Value.
function recommendations(active, st){
  var r = bestBets(active, st);
  var names = ['Beste Wette', 'Alternative', 'Alternative'];
  var recs = r.slips.map(function(sl, i){
    return { title: names[i], sub: 'Bei ' + (sl.legs[0].prov || 'Betano') + ' · jeder Tipp mit Value', slip: sl, also: [], rank: i + 1 };
  });

    recs.push({ title: i ? 'Hohe Trefferchance, Alternative' : 'Hohe Trefferchance', sub: 'Bei ' + (sl.legs[0].prov || 'Betano') + ' · jeder Tipp ab ' + pct(SAFE.minP, 0) + ' Chance, wenig Value', slip: sl, also: [], rank: 0, safe: true });

}

function feedStatus(active){

  var a = feedAge();
  var open = active.filter(function(m){ return m.feed; });
  var nowB = Date.now(), smartM = state.api.oddsMode === 'smart';
  var fx = open.filter(function(m){ return m.fixture && !m.noRef && !(smartM && m.kickoff && m.kickoff - nowB > SMART_AHEAD); }).length;
  var missing = open.filter(function(m){ return !m.fixture && missingBook(m); }).length;
  if (fx && !a.stale) h += '<div class="banner"><span>Für ' + fx + (fx === 1 ? ' Spiel sind' : ' Spiele sind') + ' noch keine Quoten geladen. Lade sie je Liga unter „Spiele“.</span><button data-act="tab" data-tab="games">Spiele</button></div>';
  if (a.stale) h += '<div class="banner"><span>Diese Daten sind nicht von heute. Tippe auf „Aktualisieren“.</span></div>';
  else if (missing && missing === open.filter(function(m){ return !m.fixture; }).length) h += '<div class="banner"><span>Trag bei den Spielen, die dich interessieren, deine Quoten ein (' + booksLine() + '), im Fußball 1, X und 2. Daraus berechnet die App auch Doppelte Chance, Über/Unter, Beide treffen und Tore.</span><button data-act="tab" data-tab="games">Eintragen</button></div>';
  return h;
}

function updateCalc(){
  var c = state.calc, st = state.settings, out = $('calcOut');
  if (!out) return;
  var book = parseNum(c.book), p = NaN, note = '';
  if (c.mode === 'ref'){
    var tip = parseNum(c.tip), opp = parseNum(c.opp), draw = parseNum(c.draw);
    if (tip > 1 && opp > 1){
      var arr = [tip, opp]; if (draw > 1) arr.push(draw);
      p = fairProbs(arr, st.devig)[0];
      var over = arr.reduce(function(a, o){ return a + 1 / o; }, 0) - 1;
      note = 'Marge der Referenz: ' + pct(over, 1);
    }
  } else {
    var pp = parseNum(c.prob);
    if (pp > 0 && pp < 100) p = pp / 100;
  }
  if (!(book > 1) || !(p > 0)){
    out.innerHTML = '<p class="muted" style="margin:0">Gib eine Quote größer 1,00 und eine gültige Chance ein.</p>';
    return;
  }
  var ev = p * book - 1, kf = kellyFull(p, book);
  var stake = ev > 0 ? Math.round(st.bankroll * Math.min(kf * st.kelly, 0.05) * 10) / 10 : 0;
  var cls = ev >= st.minEdge ? 'good' : (ev > 0 ? 'warn' : 'bad');
  var txt = ev >= st.minEdge ? 'Value' : (ev > 0 ? 'Knapp positiv' : 'Kein Value');
  out.innerHTML = '<div class="verdict ' + cls + '"><span>' + txt + '</span><b>' + sgn(ev) + '</b></div>' +
    '<dl class="kv">' +
    '<div><dt>Faire Chance</dt><dd>' + pct(p) + '</dd></div>' +
    '<div><dt>Faire Quote</dt><dd>' + f2(1 / p) + '</dd></div>' +
    '<div><dt>Empfohlener Einsatz</dt><dd>' + (stake > 0 ? eur(stake) : '–') + '</dd></div>' +
    '<div><dt>Erwarteter Gewinn</dt><dd>' + (stake > 0 ? eur(stake * ev) : '–') + '</dd></div>' +
    '</dl>' + (note ? '<p class="muted small" style="margin:0">' + note + '. Einsatz: ' + kellyName(st.kelly) + 'Kelly, höchstens 5 % der Bankroll.</p>' : '');
}

function saveGame(){
  var err = $('e-err');
  var fail = function(msg){ err.textContent = msg; err.hidden = false; };
  var raw = function(id){ return $(id).value.trim(); };
  var filled = function(id){ return raw(id) !== ''; };
  var num = function(id){ var x = parseNum($(id).value); return x > 1 ? x : null; };
  var isFb = state.editSport === 'fb';
  var dcIds = isFb ? ['dc-hx', 'dc-xa', 'dc-ha'] : [];
  var hcIds = isFb ? [] : ['hc-rh', 'hc-ra', 'hc-bh', 'hc-ba'];
  var oddsIds = ['r-h', 'r-d', 'r-a', 'b-h', 'b-d', 'b-a', 'e-ro', 'e-ru', 'e-bo', 'e-bu'].concat(dcIds, hcIds);
  for (var i = 0; i < oddsIds.length; i++){
    if (filled(oddsIds[i]) && num(oddsIds[i]) === null) return fail('Quoten müssen Zahlen größer als 1,00 sein.');
  }
  if (!raw('e-home') || !raw('e-away')) return fail('Trage beide Namen ein.');
  var anyRes = ['r-h', 'r-d', 'r-a', 'b-h', 'b-d', 'b-a'].some(filled);
  var anyOu = ['e-line', 'e-ro', 'e-ru', 'e-bo', 'e-bu'].some(filled);
  var anyDc = dcIds.some(filled);
  var anyHc = !isFb && ['hc-line'].concat(hcIds).some(filled);
  if (!anyRes && !anyOu && !anyDc && !anyHc) return fail('Trage Ergebnis-Quoten, ein Handicap oder eine Über/Unter-Linie ein.');
  var ref = { h: num('r-h'), d: num('r-d'), a: num('r-a') }, book = { h: num('b-h'), d: num('b-d'), a: num('b-a') };
  if (anyRes || anyDc){
    if (!ref.h || !ref.a) return fail('Die Referenzquoten für 1 und 2 fehlen.');
    if (book.d && !ref.d) return fail('Für X fehlt die Referenzquote.');
    if (anyDc && !ref.d) return fail('Für die Doppelte Chance braucht die App alle drei Referenzquoten 1, X und 2.');
  }
  var dc = anyDc ? { hx: num('dc-hx'), xa: num('dc-xa'), ha: num('dc-ha') } : null;
  var hc = null;
  if (anyHc){
    var hl = parseNum(raw('hc-line').replace(/[−–]/g, '-'));
    if (!isHcLine(hl)) return fail('Die Handicap-Linie muss eine halbe Zahl sein, zum Beispiel −5,5 oder +1,5.');
    if (!num('hc-rh') || !num('hc-ra')) return fail('Für das Handicap fehlen die Referenzquoten Heim und Gast.');
    hc = { line: hl, ref: { h: num('hc-rh'), a: num('hc-ra') }, book: { h: num('hc-bh'), a: num('hc-ba') } };
  }
  var ou = null;
  if (anyOu){
    var line = parseNum($('e-line').value);
    if (!isHalfLine(line)) return fail('Die Linie muss eine halbe Zahl sein, zum Beispiel 2,5 oder 224,5.');
    if (!num('e-ro') || !num('e-ru')) return fail('Für Über und Unter fehlt die Referenzquote.');
    ou = { line: line, ref: { o: num('e-ro'), u: num('e-ru') }, book: { o: num('e-bo'), u: num('e-bu') } };
  }
  var anyBook = book.h || book.d || book.a || (ou && (ou.book.o || ou.book.u)) || (dc && (dc.hx || dc.xa || dc.ha)) || (hc && (hc.book.h || hc.book.a));
  if (!anyBook) return fail('Trage mindestens eine Quote deines Buchmachers ein.');
  var data = { sport: state.editSport, home: raw('e-home'), away: raw('e-away'), league: raw('e-league'), time: raw('e-time'), ref: ref, book: book, ou: ou, dc: dc, hc: hc, sample: false };
  if (state.editing === 'new'){ data.id = uid(); state.matches.push(data); }
  else state.matches = state.matches.map(function(m){ return m.id === state.editing ? Object.assign({}, m, data) : m; });
  save(); closeSheet(); renderAll();
}

  var actionsUrl = ri.ok ? 'https://github.com/' + ri.owner + '/' + ri.repo + '/actions/workflows/push-dienst.yml' : 'https://github.com';
  openSheet('<div class="grab"></div><h2>Push-Dienst einrichten</h2>' +
    '<p class="sub">Zwei Schritte im Safari, zusammen etwa 3 Minuten. Den Rest richtet GitHub bei Cloudflare automatisch ein.</p>' +
    '<ol class="guide">' +
    '<li><b>Schlüssel bei Cloudflare holen.</b> <a class="link" href="https://dash.cloudflare.com/profile/api-tokens" target="_blank" rel="noopener">API-Tokens öffnen</a><br>' +
      '<b>Create Token</b> → bei <b>„Edit Cloudflare Workers“</b> auf <b>Use template</b>. Unter „Account Resources“ dein Konto wählen, unter „Zone Resources“ <b>All zones</b>. Dann <b>Continue to summary</b> → <b>Create Token</b> → Token <b>kopieren</b>.</li>' +
    '<li><b>Bei GitHub hinterlegen.</b> <a class="link" href="' + esc(secretUrl) + '" target="_blank" rel="noopener">Secret anlegen öffnen</a><br>' +
      'Name genau <code>CLOUDFLARE_API_TOKEN</code>, darunter den Token einfügen → <b>Add secret</b>.</li>' +
    '</ol>' +
    '<p class="hint">Danach Claude Bescheid sagen oder selbst starten: <a class="link" href="' + esc(actionsUrl) + '" target="_blank" rel="noopener">Push-Dienst starten</a> (dort „Run workflow“). Nach 1–2 Minuten steht die Adresse automatisch hier in den Einstellungen, dann nur noch <b>Benachrichtigungen einschalten</b> und <b>Test senden</b>. Neue Versionen spielt GitHub künftig selbst ein.</p>' +
    '<p class="hint">Push gibt es auf dem iPhone nur in der installierten App (Safari → Teilen → Zum Home-Bildschirm).</p>' +
    '<details class="manual"><summary>Von Hand einrichten (ohne GitHub)</summary>' +
    '<ol class="guide">' +
    '<li><b>Workers &amp; Pages</b> → <b>Create</b> → „Hello World“, Name <code>value-slip</code> → <b>Deploy</b>.</li>' +
    '<li><b>Edit code</b>: Inhalt löschen, Code einfügen, <b>Deploy</b>.<br><button class="btn ghost sm" id="pg-copy" data-act="pushcode" type="button"' + (state.workerCode ? '' : ' disabled') + '>Code kopieren</button> <a class="link" href="dienst/worker.js" target="_blank" rel="noopener">Code ansehen</a></li>' +
    '<li><b>Storage &amp; Databases</b> → <b>KV</b> → Speicher <code>value-slip</code> anlegen.</li>' +
    '<li>Worker → <b>Bindings</b> → <b>KV namespace</b>: Variable name <code>VS</code>, Speicher wählen.</li>' +
    '<li><b>Settings</b> → <b>Variables and Secrets</b>: Text <code>ALLOWED_ORIGIN</code> = <code>' + esc(origin) + '</code></li>' +
    '<li><b>Settings</b> → <b>Trigger Events</b> → <b>Cron</b>: <code>*/5 * * * *</code></li>' +
    '<li>Adresse (…<code>.workers.dev</code>) hier eintragen → einschalten → Test.</li>' +
    '</ol></details>' +
    '<div class="actions"><button class="btn block" data-act="settings">Zurück zu den Einstellungen</button></div>');
}
function rerenderApi(){
  if (!$('overlay').hidden && !state.editing) openSettings();
  renderSlip(); renderGames();
}
function maybeAutoRefresh(){
  var a = state.api;
  setTimeout(function(){ opMaybe(false); autoSettle(); }, 1500);
  if (!apiReady() || state.loading) return;
  // Nach einem Fehlschlag fruehestens nach 30 Minuten automatisch neu versuchen (spart Abrufe)
  if (Date.now() - (a.lastAttempt || 0) < 30 * 60000) return;
  // Spielplan ist kostenlos: hoechstens alle 30 Minuten, damit die Spiele immer tagesaktuell sind
  var schedDue = Date.now() - (a.lastSchedule || 0) >= 30 * 60000;
  if (a.oddsMode === 'smart'){ if (schedDue) refreshOdds({ smart: true }); return; }
  var oddsDue = a.autoH > 0 && a.oddsMode !== 'manual' && Date.now() - (a.lastFetch || 0) >= a.autoH * 3600000;
  if (oddsDue) refreshOdds();
  else if (schedDue) refreshOdds({ noOdds: true });
}
function startApi(){
  try {
    var stored = JSON.parse(localStorage.getItem(FEED_STORE) || 'null');
    if (stored) onFeed(stored, false);
  } catch (e) {}
  // Zuerst die Abrufe des Push-Dienstes holen (kostenlos), danach entscheidet der Spar-Modus, was noch fehlt
  var first = state.api.push.on ? pushSync().catch(function(){}) : Promise.resolve();
  first.then(maybeAutoRefresh);
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible'){ if (state.api.push.on) pushSync().catch(function(){}).then(maybeAutoRefresh); else maybeAutoRefresh(); } });
  // Solange die App offen ist, alle 5 Minuten pruefen (kostet nur, wenn der Spar-Modus etwas laden will)
  setInterval(function(){ if (document.visibilityState !== 'hidden'){ maybeAutoRefresh(); schedulePushSync(); } }, 5 * 60000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', function(e){ if (e.data && e.data.type === 'push-open'){ showTab('slip'); pushSync().catch(function(){}); } });
  if ('serviceWorker' in navigator && location.protocol !== 'file:'){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
}
// Jede Minute pruefen, ob ein Spiel angepfiffen wurde; dann fliegt es aus den Scheinen.
setInterval(function(){
  var now = Date.now();
  var n = viewMatches().filter(function(m){ return hasStarted(m, now); }).length;
  if (n !== state.startedCount){
    var first = state.startedCount < 0;
    state.startedCount = n;
    if (!first && $('overlay').hidden) renderAll(true);
  }
}, 60000);

function slipText(){
  var sl = currentSlip();
  if (!sl) return '';
  var lines = ['Value Slip · ' + sl.legs.length + ' Tipps · Quote ' + f2(sl.odds) + ' · bei ' + (sl.legs[0].prov || 'Betano')];
  sl.legs.forEach(function(l, i){ lines.push((i + 1) + ') ' + pickName(l) + ' (' + l.game + ') @ ' + (l.est ? '≈' : '') + f2(l.book) + (l.est ? ' [geschätzt]' : '') + ' · Chance ' + pct(l.p)); });
  lines.push('Trefferchance ' + pct(sl.p) + ' · Value ' + sgn(sl.ev));
  return lines.join('\n');
}
function copyText(txt, msg){
  msg = msg || 'Schein kopiert';
  var ok = function(){ toast(msg); };
  var fallback = function(){
    var ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var done = false; try { done = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta); toast(done ? msg : 'Kopieren nicht möglich');
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, fallback); else fallback();
}

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]');
  if (!t){ if (e.target === $('overlay')) closeSheet(); return; }
  var act = t.getAttribute('data-act'), st = state.settings;
  switch (act){
    case 'tab': showTab(t.getAttribute('data-tab')); break;
    case 'mode': st.mode = t.getAttribute('data-mode'); state.slipIdx = 0; state.recOpen = 0; save(); renderSlip(); break;
    case 'sportf': st.sport = t.getAttribute('data-v'); state.slipIdx = 0; state.recOpen = 0; save(); renderSlip(); break;
    case 'marketf': st.market = t.getAttribute('data-v'); state.slipIdx = 0; state.recOpen = 0; save(); renderSlip(); break;
    case 'step': {
      var key = t.getAttribute('data-key'), dir = +t.getAttribute('data-dir');
      if (key === 'target') st.target = Math.min(100, Math.max(1.5, Math.round((st.target + dir * 0.5) * 10) / 10));
      else st.maxLegs = Math.min(6, Math.max(1, st.maxLegs + dir));
      state.slipIdx = 0; state.recOpen = 0; save(); renderSlip(); break;
    }
    case 'pickslip': state.slipIdx = +t.getAttribute('data-i'); renderSlip(); break;
    case 'rec': state.recOpen = +t.getAttribute('data-i'); renderSlip(); break;
    case 'tune': state.tuneOpen = !state.tuneOpen; renderSlip(); break;
    case 'copy': copyText(slipText()); break;
    case 'edit': openEditor(t.getAttribute('data-id')); break;
    case 'fedit': { var fid = t.getAttribute('data-id'); var fmm = (state.feed ? state.feed.matches : []).filter(function(x){ return x.id === fid; })[0]; if (fmm) markInterest(fmm.lkey); openFeedEditor(fid); break; }
    case 'fsave': saveFeedOdds(); break;
    case 'freset': delete state.ov[state.editing]; save(); closeSheet(); renderAll(true); toast('Geladene Quoten wiederhergestellt'); break;
    case 'new': openEditor(null); break;
    case 'esport': setEditSport(t.getAttribute('data-v')); break;
    case 'savegame': saveGame(); break;
    case 'del':
      if (!state.confirmDel){ state.confirmDel = true; t.textContent = 'Wirklich löschen?'; break; }
      state.matches = state.matches.filter(function(m){ return m.id !== state.editing; });
      save(); closeSheet(); renderAll(); break;
    case 'close': closeSheet(); break;
    case 'settings': openSettings(); break;
    case 'ahset': state.api.ah = t.getAttribute('data-v') === 'on'; AH_FB = state.api.ah; saveApi(); schedulePushSync(); openSettings(); break;
    case 'taxset-Betano': case 'taxset-bet365':
      st.tax = Object.assign({}, DEFAULT_TAX, st.tax || {}); st.tax[act.slice(7)] = t.getAttribute('data-v') === 'on'; state.recOpen = 0; save(); openSettings(); renderAll(); break;
    case 'bookset-fb': case 'bookset-bb': case 'bookset-ih':
      st.books = Object.assign({}, DEFAULT_BOOKS, st.books || {}); st.books[act.slice(8)] = t.getAttribute('data-v'); state.recOpen = 0; save(); openSettings(); renderAll(); break;
    case 'kelly': st.kelly = +t.getAttribute('data-v'); save(); openSettings(); renderAll(); break;
    case 'devig': st.devig = t.getAttribute('data-v'); save(); openSettings(); renderAll(); break;
    case 'clearsamples': state.matches = state.matches.filter(function(m){ return !m.sample; }); save(); renderAll(); toast('Beispiele entfernt'); break;
    case 'resetsamples': state.matches = state.matches.filter(function(m){ return !m.sample; }).concat(sampleMatches()); save(); closeSheet(); renderAll(); toast('Beispiele geladen'); break;
    case 'calcmode': state.calc.mode = t.getAttribute('data-m'); renderCalc(); break;
    case 'refresh': refreshOdds(state.api.oddsMode === 'smart' ? { smart: true } : undefined); break;
    case 'lodds': refreshOdds({ only: t.getAttribute('data-k') }); break;
    case 'omode': state.api.oddsMode = t.getAttribute('data-v'); state.api.modeSet = true; saveApi(); openSettings(); break;
    case 'opsetup': opSetup().then(function(){ useBet365(); toast('OddsPapi eingerichtet'); return opLoad({ manual: true }); }, function(){}); break;
    case 'opload': opLoad({ manual: true }); break;
    case 'showopkey': { var ko = $('s-opkey'); if (ko){ ko.type = ko.type === 'password' ? 'text' : 'password'; t.textContent = ko.type === 'password' ? 'Zeigen' : 'Verbergen'; } break; }
    case 'opmove': state.api.op.key = String(state.api.key || '').trim(); state.api.key = ''; state.api.op.setup = null; saveApi(); openSettings(); toast('Schlüssel verschoben. Trag oben deinen Schlüssel von The Odds API ein.'); break;
    case 'pushon': pushEnable(); break;
    case 'pushoff': pushOff(); break;
    case 'pushtest': pushTest(); break;
    case 'pushguide': openPushGuide(); break;
    case 'pushcode': if (state.workerCode) copyText(state.workerCode, 'Code kopiert'); break;
    case 'pushlead-fb': case 'pushlead-bb': case 'pushlead-ih': state.api.push.lead[act.slice(9)] = +t.getAttribute('data-v'); saveApi(); schedulePushSync(); openSettings(); break;
    case 'pushval': state.api.push.value = t.getAttribute('data-v') === 'on'; saveApi(); schedulePushSync(); openSettings(); break;
    case 'pushopcalls': state.api.push.opCalls = +t.getAttribute('data-v'); saveApi(); schedulePushSync(); openSettings(); break;
    case 'pushcalls': state.api.push.calls = +t.getAttribute('data-v'); saveApi(); schedulePushSync(); openSettings(); break;
    case 'anaby': state.anaBy = t.getAttribute('data-v'); renderCalc(); break;
    case 'logslip': openLogSlip(); break;
    case 'savebet': saveBet(); break;
    case 'settle': settleBets(false); break;
    case 'legset': {
      var bt = state.bets.filter(function(x){ return x.id === t.getAttribute('data-b'); })[0];
      if (bt){ var lg2 = bt.legs[+t.getAttribute('data-i')], v2 = t.getAttribute('data-v'); lg2.state = lg2.state === v2 ? 'open' : v2; recomputeBet(bt); saveBets(); renderCalc(); }
      break;
    }
    case 'delbet': {
      var idb = t.getAttribute('data-b');
      if (state.confirmBet !== idb){ state.confirmBet = idb; renderCalc(); break; }
      state.bets = state.bets.filter(function(x){ return x.id !== idb; }); state.confirmBet = null; saveBets(); renderCalc(); break;
    }
    case 'osport': case 'ominp': case 'oonly': {
      st.odds = Object.assign({ sport: 'all', minP: 0.6, only: 'all' }, st.odds || {});
      var ov2 = t.getAttribute('data-v');
      if (act === 'osport') st.odds.sport = ov2; else if (act === 'ominp') st.odds.minP = +ov2; else st.odds.only = ov2;
      save(); renderOdds(); break;
    }
    case 'league': { var lk = t.getAttribute('data-k'); state.api.leagues[lk] = !state.api.leagues[lk]; saveApi(); schedulePushSync(); openSettings(); break; }
    case 'win': state.api.windowH = +t.getAttribute('data-v'); saveApi(); openSettings(); break;
    case 'auto': state.api.autoH = +t.getAttribute('data-v'); saveApi(); openSettings(); break;
    case 'showkey': { var ki = $('s-key'); if (ki){ ki.type = ki.type === 'password' ? 'text' : 'password'; t.textContent = ki.type === 'password' ? 'Zeigen' : 'Verbergen'; } break; }
  }
});

document.addEventListener('input', function(e){
  if (e.target && e.target.classList && e.target.classList.contains('auto')) e.target.classList.remove('auto');
  if (e.target && e.target.id && $('cmp-' + (e.target.getAttribute('data-cmp') || e.target.id))) updateCmp(e.target.getAttribute('data-cmp') || e.target.id);
  var id = e.target.id;
  var map = { 'c-book': 'book', 'c-tip': 'tip', 'c-opp': 'opp', 'c-draw': 'draw', 'c-prob': 'prob' };
  if (map[id]){ state.calc[map[id]] = e.target.value; updateCalc(); return; }
  if (id === 's-bank'){ var b = parseNum(e.target.value); if (b > 0){ state.settings.bankroll = b; save(); $('bankChip').textContent = eur(b); renderSlip(); updateCalc(); } }
  if (id === 's-key'){ state.api.key = e.target.value.trim(); state.apiError = ''; saveApi(); }
  if (id === 's-base'){ state.api.base = e.target.value.trim(); saveApi(); }
  if (id === 's-push'){ state.api.push.url = e.target.value.trim(); saveApi(); }
  if (id === 's-opkey'){ var nk = e.target.value.trim(); if (nk !== state.api.op.key){ state.api.op.key = nk; state.api.op.setup = null; state.api.op.err = ''; state.api.op.via = ''; saveApi(); } }
  if (id === 's-edge'){ var d = parseNum(e.target.value); if (d >= 0 && d <= 50){ state.settings.minEdge = d / 100; save(); renderSlip(); renderGames(); updateCalc(); } }
});
document.addEventListener('pointerdown', function(e){ if (e.target && e.target.closest && e.target.closest('#anaChart')) anaTip(e); });
document.addEventListener('pointermove', function(e){ if (e.buttons && e.target && e.target.closest && e.target.closest('#anaChart')) anaTip(e); });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !$('overlay').hidden) closeSheet(); });

renderAll();
startApi();
})();
</script>
